<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Chat Room - Steb.io</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="create-store.html">Start Selling</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;">
    <h2 id="chatRoomTitle">Loading chat room…</h2>
    <div id="joinBox" style="margin-top:1rem;"></div>
    <section id="chatSection" style="display:none; margin-top:1rem;">
      <div id="chatMessages" style="max-height:300px; overflow-y:auto; border:1px solid var(--border); padding:0.5rem; background:var(--secondary);"></div>
      <form id="chatForm" style="margin-top:0.5rem; display:flex; gap:0.5rem;">
        <input id="chatInput" type="text" placeholder="Type your message..." style="flex:1;">
        <button type="submit" class="button">Send</button>
      </form>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    (function() {
      const API_BASE = window.location.hostname.includes('onrender.com')
        ? 'https://stebio.onrender.com/api'
        : '/api';
      let pollTimer = null;

      function getChatRoom(id) {
        return fetch(\`\${API_BASE}/chatroom/\${id}\`)
          .then(res => {
            if (!res.ok) throw new Error('Chat room not found');
            return res.json();
          });
      }

      function joinChatRoom(id) {
        return fetch(\`\${API_BASE}/chatroom/\${id}/join\`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({})
        }).then(res => res.json());
      }

      function loadMessages(id) {
        fetch(\`\${API_BASE}/chatroom/\${id}/messages\`)
          .then(res => {
            if (res.status === 403 || res.status === 401) {
              document.getElementById('chatSection').style.display = 'none';
              document.getElementById('joinBox').innerHTML = '<p>You do not have access to this chat room.</p>';
              return null;
            }
            return res.json();
          })
          .then(data => {
            if (!data) return;
            const msgs = data.messages || [];
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            msgs.forEach(m => {
              const div = document.createElement('div');
              div.innerHTML = '<strong>' + m.username + '</strong>: ' +
                              m.message +
                              ' <small>' + new Date(m.createdAt).toLocaleString() + '</small>';
              container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
          })
          .catch(err => console.error('Error loading messages', err));
      }

      function setupChat(id, room) {
        document.getElementById('joinBox').style.display = 'none';
        document.getElementById('chatSection').style.display = '';
        loadMessages(id);
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(() => loadMessages(id), 5000);
        document.getElementById('chatForm').addEventListener('submit', function(e) {
          e.preventDefault();
          const msg = document.getElementById('chatInput').value.trim();
          if (!msg) return;
          fetch(\`\${API_BASE}/chatroom/\${id}/message\`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
          })
            .then(res => {
              if (!res.ok) throw new Error('Failed to send');
              return res.json();
            })
            .then(() => {
              document.getElementById('chatInput').value = '';
              loadMessages(id);
            })
            .catch(err => console.error('Error sending message', err));
        }, { once: true });
      }

      document.addEventListener('DOMContentLoaded', function() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) {
          document.getElementById('chatRoomTitle').textContent = 'Chat room not found.';
          return;
        }
        getChatRoom(id)
          .then(room => {
            document.getElementById('chatRoomTitle').textContent = room.title;
            const joinBox = document.getElementById('joinBox');
            if (room.price > 0) {
              joinBox.innerHTML = '<p>Price: $' + room.price.toFixed(2) +
                '</p><button id="joinBtn" class="button">Unlock Chat</button>';
            } else {
              joinBox.innerHTML = '<p>This chat room is free.</p>' +
                '<button id="joinBtn" class="button">Join Chat</button>';
            }
            document.getElementById('joinBtn').addEventListener('click', function() {
              joinChatRoom(id)
                .then(() => {
                  setupChat(id, room);
                })
                .catch(err => {
                  console.error('Error joining room', err);
                  joinBox.innerHTML = '<p>Failed to join chat room.</p>';
                });
            }, { once: true });
          })
          .catch(() => {
            document.getElementById('chatRoomTitle').textContent = 'Chat room not found.';
          });
      });
    })();
  </script>
</body>
</html>
