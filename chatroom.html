<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Room – Steb.io</title>
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css" />
  <!-- Socket.IO client will be served from the back‑end server at /socket.io/socket.io.js -->
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="store.html" id="navMyStore">My Store</a>
        <a href="create-store.html" id="navCreateStore">Create Store</a>
        <a href="create-product.html" id="navCreateProduct">Add Product</a>
        <a href="dashboard.html" id="navDashboard">Dashboard</a>
        <a href="my-products.html" id="navMyProducts">My Products</a>
        <a href="reviews.html">Reviews</a>
        <a href="support.html">Support</a>
        <a href="#" id="navLogout">Logout</a>
        <a href="login.html" id="navLogin">Sign in</a>
        <a href="signup.html" id="navSignup">Sign up</a>
      </nav>
    </div>
  </header>
  <main class="container" style="padding:2rem 0; max-width:800px;">
    <h2>Chat Room</h2>
    <div id="chatContainer" style="border:1px solid #ddd; border-radius:4px; padding:1rem; min-height:300px; display:flex; flex-direction:column;">
      <ul id="messages" style="list-style:none; margin:0; padding:0; flex-grow:1; overflow-y:auto;"></ul>
      <form id="chatForm" style="display:flex; margin-top:1rem;">
        <input id="msgInput" type="text" placeholder="Type a message..." style="flex-grow:1; padding:0.5rem; border:1px solid #ccc; border-radius:4px;" required />
        <button type="submit" class="button" style="margin-left:0.5rem;">Send</button>
      </form>
    </div>
  </main>
  <script src="auth.js"></script>
  <!-- load socket.io client from server.  Note: this will fail if server does not host socket.io; ensure server.js includes Socket.IO -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    (function() {
      const API_BASE = document.querySelector('meta[name="steb-api-base"]').getAttribute('content') || '/api';
      // Determine the room ID from query params
      const urlParams = new URLSearchParams(window.location.search);
      const room = urlParams.get('room');
      if (!room) {
        document.getElementById('chatContainer').innerHTML = '<p>Chat room not found.</p>';
        return;
      }
      // Initialize socket.io connection
      const socket = io();
      // Join the specified room
      socket.emit('join', { room });
      // Handle sending messages
      const form = document.getElementById('chatForm');
      const input = document.getElementById('msgInput');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const text = input.value.trim();
        if (text) {
          const username = localStorage.getItem('username') || 'Anonymous';
          socket.emit('message', { room, text, username });
          input.value = '';
        }
      });
      // Handle incoming messages
      const messages = document.getElementById('messages');
      socket.on('message', function(msg) {
        const li = document.createElement('li');
        li.style.padding = '0.3rem 0';
        const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString();
        li.innerHTML = `<strong>${msg.username}</strong> <em style="font-size:0.8rem; color:#777;">${time}</em><br>${msg.text}`;
        messages.appendChild(li);
        // Scroll to bottom
        messages.scrollTop = messages.scrollHeight;
      });
    })();
  </script>
</body>
</html>
