<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Room – Steb</title>
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css">
  <style>
    .messages {
      max-height: 420px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0f0f14;
      padding: .75rem;
    }
    .msg {
      padding: .4rem .5rem;
      border-radius: 8px;
    }
    .msg + .msg {
      margin-top: .25rem;
    }
    .msg .meta {
      display: flex;
      gap: .5rem;
      align-items: baseline;
    }
    .msg .meta strong {
      font-weight: 700;
    }
    .msg .body {
      margin-top: .1rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .notice {
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: .9rem;
      background: #101018;
      color: var(--danger);
    }
    footer {
      color: var(--muted);
      font-size: .875rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
<header id="top-nav">
  <div class="container nav">
    <div class="brand">STEB</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="create-store.html">Create Store</a>
      <a href="create-product.html">Add Product</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="support.html">Support</a>
    </nav>
    <div class="auth-links"></div>
  </div>
</header>

<main class="container" style="padding:1.25rem 0 2rem;">
  <h2 id="chatRoomTitle">Loading chat room…</h2>
  <div id="status" class="notice" style="display:none;"></div>
  <div id="joinBox" class="card stack" style="margin-top:1rem;display:none;"></div>
  <section id="chatSection" class="stack" style="display:none;margin-top:1rem;">
    <div id="chatMessages" class="messages" aria-live="polite"></div>
    <form id="chatForm" class="row" autocomplete="off">
      <input id="chatInput" type="text" placeholder="Type your message…" maxlength="2000" />
      <button id="sendBtn" type="submit" class="button">Send</button>
    </form>
    <footer id="chatHint">Press Enter to send • Messages refresh every 5s</footer>
  </section>
</main>

<script src="auth.js"></script>
<script>
(() => {
  const meta = document.querySelector('meta[name="steb-api-base"]');
  const API_BASE = (meta && meta.content) ? meta.content.replace(/\/+$/, '') : '/api';
  const $ = sel => document.querySelector(sel);

  function showStatus(msg, isError = false) {
    const box = $('#status');
    box.style.display = 'block';
    box.classList.toggle('error', !!isError);
    box.textContent = msg;
  }
  function hideStatus() {
    const box = $('#status');
    box.style.display = 'none';
    box.textContent = '';
  }

  async function api(path, opts = {}) {
    const token = localStorage.getItem('token');
    const headers = Object.assign({ 'Accept':'application/json' }, opts.headers || {});
    if (!(opts.body instanceof FormData)) {
      headers['Content-Type'] = headers['Content-Type'] || 'application/json';
    }
    if (token) headers['Authorization'] = \`Bearer \${token}\`;
    const res = await fetch(\`\${API_BASE}\${path}\`, { credentials:'include', ...opts, headers });
    let data = null;
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) {
      try { data = await res.json(); } catch {}
    } else {
      data = await res.text().catch(() => null);
    }
    if (!res.ok) {
      const message = (data && (data.error || data.message)) || res.statusText || 'Request failed';
      const error = new Error(message);
      error.status = res.status;
      error.data = data;
      throw error;
    }
    return data;
  }

  let pollTimer = null;
  let currentRoomId = null;

  function renderJoinUI(room) {
    const joinBox = $('#joinBox');
    joinBox.innerHTML = '';
    const details = document.createElement('div');
    details.className = 'stack';
    const textRow = document.createElement('div');
    textRow.className = 'row';
    textRow.style.justifyContent = 'space-between';
    const descDiv = document.createElement('div');
    descDiv.textContent = room.description || 'Private chat room';
    const priceDiv = document.createElement('div');
    priceDiv.innerHTML = '<strong>' + (room.price > 0 ? '$' + Number(room.price).toFixed(2) : 'Free') + '</strong>';
    textRow.appendChild(descDiv);
    textRow.appendChild(priceDiv);
    details.appendChild(textRow);
    const joinBtn = document.createElement('button');
    joinBtn.className = 'button';
    joinBtn.textContent = room.price > 0 ? 'Unlock Chat' : 'Join Chat';
    joinBtn.onclick = async () => {
      try {
        joinBtn.disabled = true;
        hideStatus();
        await api(\`/chatroom/\${encodeURIComponent(currentRoomId)}/join\`, { method:'POST', body: JSON.stringify({}) });
        setupChat(currentRoomId, room);
      } catch (e) {
        showStatus(\`Failed to join: \${e.message}\`, true);
      } finally {
        joinBtn.disabled = false;
      }
    };
    joinBox.append(details, joinBtn);
    joinBox.style.display = 'block';
  }

  function renderMessages(list) {
    const container = $('#chatMessages');
    container.innerHTML = '';
    list.forEach(m => {
      const item = document.createElement('div');
      item.className = 'msg';
      const meta = document.createElement('div');
      meta.className = 'meta';
      const strong = document.createElement('strong');
      strong.textContent = m.username || 'User';
      const dot = document.createElement('small');
      dot.textContent = '•';
      dot.style.margin = '0 .25rem';
      const time = document.createElement('time');
      time.dateTime = m.createdAt ? new Date(m.createdAt).toISOString() : '';
      time.textContent = m.createdAt ? new Date(m.createdAt).toLocaleString() : '';
      meta.append(strong, dot, time);
      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = m.message || '';
      item.append(meta, body);
      container.appendChild(item);
    });
    container.scrollTop = container.scrollHeight;
  }

  async function loadMessagesOnce() {
    if (!currentRoomId) return;
    try {
      const data = await api(\`/chatroom/\${encodeURIComponent(currentRoomId)}/messages\`);
      renderMessages((data && data.messages) || []);
      hideStatus();
    } catch (e) {
      if (e.status === 401 || e.status === 403) {
        $('#chatSection').style.display = 'none';
        $('#joinBox').style.display = 'block';
        showStatus('You do not have access to this chat room. Please join/unlock first.', true);
        clearInterval(pollTimer); pollTimer = null;
        return;
      }
      showStatus(\`Error loading messages: \${e.message}\`, true);
    }
  }

  function setupChat(id, room) {
    $('#joinBox').style.display = 'none';
    $('#chatSection').style.display = 'block';
    clearInterval(pollTimer);
    loadMessagesOnce();
    pollTimer = setInterval(loadMessagesOnce, 5000);
    const form = $('#chatForm');
    form.onsubmit = async (ev) => {
      ev.preventDefault();
      const input = $('#chatInput');
      const sendBtn = $('#sendBtn');
      const msg = input.value.trim();
      if (!msg) return;
      try {
        sendBtn.disabled = true;
        await api(\`/chatroom/\${encodeURIComponent(id)}/message\`, {
          method:'POST',
          body: JSON.stringify({ message: msg })
        });
        input.value = '';
        await loadMessagesOnce();
      } catch (e) {
        showStatus(\`Failed to send: \${e.message}\`, true);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    };
  }

  document.addEventListener('visibilitychange', () => {
    if (!currentRoomId) return;
    if (document.visibilityState === 'visible') {
      loadMessagesOnce();
      if (!pollTimer) pollTimer = setInterval(loadMessagesOnce, 5000);
    } else {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  });

  (async function init() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    currentRoomId = id;
    if (!id) {
      $('#chatRoomTitle').textContent = 'Chat room not found.';
      showStatus('Missing URL parameter: ?id=ROOM_ID', true);
      return;
    }
    try {
      hideStatus();
      const room = await api(\`/chatroom/\${encodeURIComponent(id)}\`);
      $('#chatRoomTitle').textContent = room.title || 'Chat Room';
      try {
        await loadMessagesOnce();
        $('#joinBox').style.display = 'none';
        $('#chatSection').style.display = 'block';
        if (!pollTimer) pollTimer = setInterval(loadMessagesOnce, 5000);
      } catch (e) {
        if (e.status === 401 || e.status === 403) {
          renderJoinUI(room);
        } else {
          throw e;
        }
      }
    } catch (e) {
      $('#chatRoomTitle').textContent = 'Chat room not found.';
      showStatus(\`Could not load chat room: \${e.message}. Check API_BASE (\${API_BASE}) and CORS.\`, true);
    }
  })();
})();
</script>
</body>
</html>
