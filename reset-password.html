<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – Steb.io</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container" style="padding:2rem 0;">
    <h2>Reset Your Password</h2>
    <form id="resetForm" style="max-width:400px;">
      <div class="stack">
        <label for="newPass">New Password</label>
        <input id="newPass" type="password" placeholder="Enter new password" required />
      </div>
      <div class="stack">
        <label for="confirmPass">Confirm Password</label>
        <input id="confirmPass" type="password" placeholder="Confirm new password" required />
      </div>
      <button type="submit" class="button" style="width:100%;">Reset Password</button>
    </form>
    <div id="status" style="margin-top:1rem;"></div>
  </main>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const token  = params.get('token');
      document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPass = document.getElementById('newPass').value;
        const confirm = document.getElementById('confirmPass').value;
        if (newPass !== confirm) {
          document.getElementById('status').textContent = 'Passwords do not match.';
          return;
        }
        try {
          const res  = await fetch('/api/users/reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password: newPass })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Reset failed');
          document.getElementById('status').textContent = data.message || 'Password reset successful.';
        } catch (err) {
          document.getElementById('status').textContent = err.message;
        }
      });
    })();
  </script>
</body>
</html>
