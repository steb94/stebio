<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – Steb.io</title>
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="store.html" id="navMyStore">My Store</a>
        <a href="login.html" id="navLogin">Sign in</a>
        <a href="signup.html" id="navSignup">Sign up</a>
      </nav>
    </div>
  </header>
  <main class="container" style="padding:2rem 0; max-width:500px;">
    <h2>Reset Your Password</h2>
    <form id="resetForm">
      <div class="stack">
        <label for="newPass">New Password</label>
        <input id="newPass" type="password" placeholder="Enter a new password" required />
      </div>
      <div class="stack">
        <label for="confirmPass">Confirm New Password</label>
        <input id="confirmPass" type="password" placeholder="Confirm your new password" required />
      </div>
      <button type="submit" class="button w-100">Reset Password</button>
    </form>
  </main>
  <script src="auth.js"></script>
  <script>
    (function() {
      const API_BASE = document.querySelector('meta[name="steb-api-base"]').getAttribute('content') || '/api';
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (!token) {
          alert('Invalid or missing reset token.');
          window.location.href = 'login.html';
          return;
        }
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
          e.preventDefault();
          const newPass = document.getElementById('newPass').value;
          const confirm = document.getElementById('confirmPass').value;
          if (newPass !== confirm) {
            alert('Passwords do not match');
            return;
          }
          try {
            const res = await fetch(`${API_BASE}/users/reset-password`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token, password: newPass })
            });
            const contentType = res.headers.get('content-type') || '';
            let data = null;
            if (contentType.includes('application/json')) {
              try { data = await res.json(); } catch { data = null; }
            } else {
              await res.text();
            }
            if (!res.ok) {
              throw new Error((data && (data.error || data.message)) || res.statusText || 'Failed to reset password');
            }
            alert((data && data.message) || 'Password reset successfully! Please log in.');
            window.location.href = 'login.html';
          } catch (err) {
            alert(err.message || 'Error resetting password');
          }
        });
      });
    })();
  </script>
</body>
</html>
