<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Steb.io</title>
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header id="top-nav">
  <div class="container nav">
    <div class="brand">Steb.io</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="support.html">Support</a>
    </nav>
    <div class="auth-links"></div>
  </div>
</header>

<main class="container" style="padding:2rem 0;">
  <h2>Reset Your Password</h2>
  <form id="resetForm" style="max-width:400px;margin-top:1rem;">
    <div class="stack">
      <label for="resetPassword">New Password</label>
      <input id="resetPassword" type="password" required />
    </div>
    <div class="stack">
      <label for="resetConfirm">Confirm New Password</label>
      <input id="resetConfirm" type="password" required />
    </div>
    <button type="submit" class="button" style="width:100%;">Reset Password</button>
  </form>
  <p id="resetMessage" style="margin-top:1rem;"></p>
</main>

<script src="auth.js"></script>
<script>
(function () {
  const API_BASE = '/api';
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if (!token) {
    document.getElementById('resetMessage').innerText = 'Invalid or missing reset token.';
    document.getElementById('resetForm').style.display = 'none';
    return;
  }
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pass = document.getElementById('resetPassword').value;
    const confirm = document.getElementById('resetConfirm').value;
    if (pass !== confirm) {
      document.getElementById('resetMessage').innerText = 'Passwords do not match.';
      return;
    }
    try {
      const res = await fetch(\`${API_BASE}/users/reset/${encodeURIComponent(token)}\`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || 'Error resetting password');
      document.getElementById('resetMessage').innerText = 'Password reset successful. You may now log in.';
      document.getElementById('resetForm').style.display = 'none';
    } catch (err) {
      document.getElementById('resetMessage').innerText = err.message || 'Error resetting password.';
    }
  });
})();
</script>
</body>
</html>
