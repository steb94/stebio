<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Seller Dashboard – Steb</title>
  <meta name="steb-api-base" content="/api">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">STEB</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="create-store.html">Create Store</a>
        <a href="create-product.html">Add Product</a>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main class="container" style="padding:1.5rem 0 3rem;">
    <!-- Login Section -->
    <section id="loginSection" class="card stack" style="max-width:420px;margin:2rem auto;">
      <h2>Sign In to Your Dashboard</h2>
      <form id="dashLoginForm" class="stack">
        <div class="stack">
          <label for="dashUsername">Username</label>
          <input id="dashUsername" type="text" placeholder="Your username" required />
        </div>
        <div class="stack">
          <label for="dashPassword">Password</label>
          <input id="dashPassword" type="password" placeholder="Your password" required />
        </div>
        <button type="submit" class="button">Sign In</button>
      </form>
    </section>

    <!-- Dashboard Content -->
    <section id="dashboardContent" style="display:none;">
      <h2>Seller Dashboard</h2>

      <!-- Summary Cards -->
      <div class="row summary" style="margin-top:1rem;">
        <div class="card" style="flex:1;min-width:220px;">
          <div>Total Sales ($)</div>
          <div class="value" id="dashTotalSales">0</div>
        </div>
        <div class="card" style="flex:1;min-width:220px;">
          <div>Total Orders</div>
          <div class="value" id="dashTotalOrders">0</div>
        </div>
        <div class="card" style="flex:1;min-width:220px;">
          <div>Total Products</div>
          <div class="value" id="dashTotalProducts">0</div>
        </div>
      </div>

      <!-- Orders Section -->
      <section style="margin-top:2rem;">
        <h3>Your Orders</h3>
        <div class="card">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Buyer</th>
                <th>Price ($)</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- Chat Rooms Section -->
      <section style="margin-top:2rem;">
        <h3>Your Chat Rooms</h3>
        <div id="chatRoomList" class="stack"></div>
        <div class="card" style="margin-top:1rem;">
          <h4>Create Chat Room</h4>
          <form id="chatRoomForm" class="stack">
            <div class="stack">
              <label for="chatRoomTitle">Title</label>
              <input id="chatRoomTitle" type="text" placeholder="Chat room title" required />
            </div>
            <div class="stack">
              <label for="chatRoomPrice">Price</label>
              <input id="chatRoomPrice" type="number" step="0.01" min="0" placeholder="0.00" />
            </div>
            <button type="submit" class="button">Create Chat Room</button>
          </form>
        </div>
      </section>

      <!-- Posts Section -->
      <section style="margin-top:2rem;">
        <h3>Your Store Posts</h3>
        <div id="postList" class="card" style="padding:0;"></div>
        <div class="card" style="margin-top:1rem;">
          <h4>Create Post</h4>
          <form id="postForm" class="stack">
            <div class="stack">
              <label for="postText">Post Text</label>
              <textarea id="postText" placeholder="Write your update…" rows="3"></textarea>
            </div>
            <div class="stack">
              <label for="postMedia">Media URL (optional)</label>
              <input id="postMedia" type="url" placeholder="https://example.com/image.png" />
            </div>
            <button type="submit" class="button">Post</button>
          </form>
        </div>
      </section>
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
  (() => {
    const meta = document.querySelector('meta[name=\"steb-api-base\"]');
    const API_BASE = meta && meta.content ? meta.content.replace(/\/+$/, '') : '/api';

    const $ = sel => document.querySelector(sel);

    async function api(path, opts = {}) {
      const token = localStorage.getItem('token');
      const headers = Object.assign({ 'Accept': 'application/json' }, opts.headers || {});
      if (!(opts.body instanceof FormData)) {
        headers['Content-Type'] = headers['Content-Type'] || 'application/json';
      }
      if (token) headers['Authorization'] = \`Bearer \${token}\`;
      const res = await fetch(\`\${API_BASE}\${path}\`, { credentials:'include', ...opts, headers });
      const ct = res.headers.get('content-type') || '';
      let data = null;
      if (ct.includes('application/json')) {
        try { data = await res.json(); } catch {}
      } else {
        data = await res.text().catch(() => null);
      }
      if (!res.ok) {
        const msg = (data && (data.error || data.message)) || res.statusText || 'Request failed';
        const err = new Error(msg);
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    function showLogin() {
      $('#loginSection').style.display = 'block';
      $('#dashboardContent').style.display = 'none';
    }
    function showDashboard() {
      $('#loginSection').style.display = 'none';
      $('#dashboardContent').style.display = 'block';
    }

    async function loadSummary() {
      try {
        const data = await api('/dashboard');
        $('#dashTotalSales').textContent = Number(data.totalSales || 0).toFixed(2);
        $('#dashTotalOrders').textContent = data.totalOrders || 0;
        $('#dashTotalProducts').textContent = data.totalProducts || 0;
      } catch (e) {
        console.error('Error loading summary', e);
      }
    }

    async function loadOrders() {
      const tbody = $('#ordersTable tbody');
      tbody.innerHTML = '';
      try {
        const orders = await api('/orders');
        (orders || []).forEach(o => {
          const tr = document.createElement('tr');
          tr.innerHTML = \`
            <td>\${o.id}</td>
            <td>\${o.productName}</td>
            <td>\${o.buyerName}</td>
            <td>\${Number(o.price).toFixed(2)}</td>
            <td>\${o.status}</td>
          \`;
          tbody.appendChild(tr);
        });
      } catch (e) {
        console.error('Error loading orders', e);
      }
    }

    async function loadPosts() {
      const storeId = localStorage.getItem('storeId');
      const list = $('#postList');
      list.innerHTML = '';
      if (!storeId) return;
      try {
        const data = await api(\`/posts/\${encodeURIComponent(storeId)}\`);
        const posts = (data && data.posts) || [];
        if (posts.length === 0) {
          list.innerHTML = '<div class=\"post\"><p>No posts yet.</p></div>';
        } else {
          posts.forEach(p => {
            const div = document.createElement('div');
            div.className = 'post';
            if (p.content) {
              const para = document.createElement('p');
              para.textContent = p.content;
              div.appendChild(para);
            }
            if (p.mediaUrl) {
              const wrapper = document.createElement('div');
              const link = document.createElement('a');
              link.href = p.mediaUrl;
              link.target = '_blank';
              link.style.color = 'var(--accent)';
              link.style.textDecoration = 'underline';
              link.textContent = 'Media';
              wrapper.appendChild(link);
              div.appendChild(wrapper);
            }
            const date = new Date(p.timestamp || p.createdAt);
            const small = document.createElement('small');
            small.textContent = date.toLocaleString();
            div.appendChild(small);
            list.appendChild(div);
          });
        }
      } catch (e) {
        console.error('Error loading posts', e);
      }
    }

    async function loadChatRooms() {
      const storeId = localStorage.getItem('storeId');
      const list = $('#chatRoomList');
      list.innerHTML = '';
      if (!storeId) return;
      try {
        const data = await api(\`/chatrooms/\${encodeURIComponent(storeId)}\`);
        (data.rooms || []).forEach(room => {
          const card = document.createElement('div');
          card.className = 'card';
          const title = document.createElement('div');
          title.innerHTML = \`<strong>\${room.title}</strong> – \${room.price > 0 ? '$' + Number(room.price).toFixed(2) : 'Free'}\`;
          const linkWrapper = document.createElement('div');
          linkWrapper.style.marginTop = '.5rem';
          const link = document.createElement('a');
          link.href = \`chatroom.html?id=\${room.id}\`;
          link.className = 'button ghost';
          link.textContent = 'Open';
          linkWrapper.appendChild(link);
          card.appendChild(title);
          card.appendChild(linkWrapper);
          list.appendChild(card);
        });
      } catch (e) {
        console.error('Error loading chat rooms', e);
      }
    }

    function initDashboard() {
      const loggedIn = localStorage.getItem('loggedIn') === 'true';
      const role = localStorage.getItem('role');
      if (!loggedIn) {
        showLogin();
        return;
      }
      if (role !== 'seller') {
        alert('You are not a seller. Please sign in with a seller account.');
        showLogin();
        return;
      }
      const storeId = localStorage.getItem('storeId');
      if (!storeId) {
        alert('Please create a store first.');
        window.location.href = 'create-store.html';
        return;
      }
      showDashboard();
      loadSummary();
      loadOrders();
      loadChatRooms();
      loadPosts();
    }

    document.getElementById('dashLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = $('#dashUsername').value.trim();
      const pass = $('#dashPassword').value.trim();
      const storedUser = localStorage.getItem('username');
      const storedPass = localStorage.getItem('password');
      if (user === storedUser && pass === storedPass) {
        localStorage.setItem('loggedIn', 'true');
        initDashboard();
      } else {
        alert('Invalid username or password.');
      }
    });

    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = $('#postText').value.trim();
      const mediaUrl = $('#postMedia').value.trim();
      const storeId = localStorage.getItem('storeId');
      const token = localStorage.getItem('token');
      if (!content && !mediaUrl) {
        alert('Post content or media URL is required.');
        return;
      }
      try {
        await api(\`/posts/\${encodeURIComponent(storeId)}\`, {
          method:'POST',
          headers: {
            'Authorization': token ? \`Bearer \${token}\` : ''
          },
          body: JSON.stringify({ content, mediaUrl })
        });
        $('#postForm').reset();
        loadPosts();
      } catch (err) {
        console.error('Error creating post', err);
      }
    });

    document.getElementById('chatRoomForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = $('#chatRoomTitle').value.trim();
      const price = parseFloat($('#chatRoomPrice').value) || 0;
      const storeId = localStorage.getItem('storeId');
      const token = localStorage.getItem('token');
      if (!title) {
        alert('Please enter a chat room title.');
        return;
      }
      try {
        await api('/chatrooms', {
          method:'POST',
          headers: {
            'Authorization': token ? \`Bearer \${token}\` : ''
          },
          body: JSON.stringify({ storeId, title, price })
        });
        $('#chatRoomForm').reset();
        loadChatRooms();
      } catch (err) {
        console.error('Error creating chat room', err);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      initDashboard();
    });
  })();
  </script>
</body>
</html>
