<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard - Steb.io</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Explore Marketplace</a>
        <a href="create-store.html">Create Store</a>
        <a href="create-product.html">Add Product</a>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>
  <main class="container" style="padding:2rem 0;">
    <!-- Login form shown if not logged in -->
    <section id="loginSection" style="display:none;">
      <h2>Sign In to Your Dashboard</h2>
      <form id="dashLoginForm" style="max-width:400px;">
        <div style="margin-bottom:1rem;">
          <label for="dashUsername">Username</label><br>
          <input type="text" id="dashUsername" placeholder="Username" style="width:100%; padding:0.5rem;">
        </div>
        <div style="margin-bottom:1rem;">
          <label for="dashPassword">Password</label><br>
          <input type="password" id="dashPassword" placeholder="Password" style="width:100%; padding:0.5rem;">
        </div>
        <button type="submit" style="padding:0.5rem 1rem;">Sign In</button>
      </form>
    </section>
    <!-- Seller dashboard content -->
    <section id="dashboardContent" style="display:none;">
      <h2>Seller Dashboard</h2>
      <div class="summary-cards" style="display:flex; gap:1rem; flex-wrap:wrap; margin-top:1rem;">
        <div class="summary-card" style="flex:1; min-width:150px; padding:1rem; border:1px solid #eee;">
          <div class="value" id="dashTotalSales">0</div>
          <div class="label">Total Sales ($)</div>
        </div>
        <div class="summary-card" style="flex:1; min-width:150px; padding:1rem; border:1px solid #eee;">
          <div class="value" id="dashTotalOrders">0</div>
          <div class="label">Total Orders</div>
        </div>
        <div class="summary-card" style="flex:1; min-width:150px; padding:1rem; border:1px solid #eee;">
          <div class="value" id="dashTotalProducts">0</div>
          <div class="label">Total Products</div>
        </div>
      </div>
      <section id="ordersSection" style="margin-top:2rem;">
        <h3>Your Orders</h3>
        <table id="ordersTable" style="width:100%; border-collapse:collapse;">
          <thead>
            <tr>
              <th>ID</th>
              <th>Product</th>
              <th>Buyer</th>
              <th>Price ($)</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
      <section id="postsSection" style="margin-top:2rem;">
        <h3>Your Store Posts</h3>
        <div id="postList"></div>
        <form id="postForm" style="margin-top:1rem; max-width:600px;">
          <textarea id="postText" rows="3" placeholder="Write something..." style="width:100%; padding:0.5rem;"></textarea>
          <input type="url" id="postMedia" placeholder="Media URL (optional)" style="width:100%; padding:0.5rem; margin-top:0.5rem;">
          <button type="submit" style="padding:0.5rem 1rem; margin-top:0.5rem;">Create Post</button>
        </form>
      </section>
    </section>
  </main>
  <script src="auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const API_BASE = window.location.hostname.includes('onrender.com')
      ? 'https://stebio.onrender.com/api'
      : '/api';

    function showLogin() {
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('dashboardContent').style.display = 'none';
    }
    function showDashboard() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'block';
    }
    function loadSummary() {
      fetch(\`\${API_BASE}/dashboard\`)
        .then(res => res.json())
        .then(data => {
          document.getElementById('dashTotalSales').textContent = data.totalSales.toFixed(2);
          document.getElementById('dashTotalOrders').textContent = data.totalOrders;
          document.getElementById('dashTotalProducts').textContent = data.totalProducts;
        })
        .catch(err => console.error('Error loading summary', err));
    }
    function loadOrders() {
      const tbody = document.querySelector('#ordersTable tbody');
      tbody.innerHTML = '';
      fetch(\`\${API_BASE}/orders\`)
        .then(res => res.json())
        .then(orders => {
          orders.forEach(o => {
            const tr = document.createElement('tr');
            tr.innerHTML = \`
              <td>\${o.id}</td>
              <td>\${o.productName}</td>
              <td>\${o.buyerName}</td>
              <td>\${o.price.toFixed(2)}</td>
              <td>\${o.status}</td>
            \`;
            tbody.appendChild(tr);
          });
        })
        .catch(err => console.error('Error loading orders', err));
    }
    function loadPosts() {
      const storeId = localStorage.getItem('storeId');
      const username = localStorage.getItem('username');
      if (!storeId || !username) return;
      fetch(\`\${API_BASE}/posts/\${storeId}?username=\${encodeURIComponent(username)}\`)
        .then(res => res.json())
        .then(data => {
          const postList = document.getElementById('postList');
          postList.innerHTML = '';
          const posts = data.posts || [];
          if (posts.length === 0) {
            postList.innerHTML = '<p>No posts yet.</p>';
          } else {
            posts.forEach(p => {
              const div = document.createElement('div');
              div.style.border = '1px solid #eee';
              div.style.padding = '0.5rem';
              div.style.marginBottom = '0.5rem';
              div.innerHTML = \`
                \${p.content ? '<p>' + p.content + '</p>' : ''}
                \${p.mediaUrl ? '<div><a href="' + p.mediaUrl + '" target="_blank">Media</a></div>' : ''}
                <small>\${new Date(p.timestamp || p.createdAt).toLocaleString()}</small>
              \`;
              postList.appendChild(div);
            });
          }
        })
        .catch(err => console.error('Error loading posts', err));
    }
    function init() {
      const loggedIn = localStorage.getItem('loggedIn') === 'true';
      const role = localStorage.getItem('role');
      if (!loggedIn) {
        showLogin();
        return;
      }
      if (role !== 'seller') {
        alert('You are not a seller.');
        showLogin();
        return;
      }
      const storeId = localStorage.getItem('storeId');
      if (!storeId) {
        alert('Please create a store first.');
        window.location.href = 'create-store.html';
        return;
      }
      showDashboard();
      loadSummary();
      loadOrders();
      loadPosts();
    }
    document.getElementById('dashLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('dashUsername').value.trim();
      const pass = document.getElementById('dashPassword').value.trim();
      const storedUsername = localStorage.getItem('username');
      const storedPassword = localStorage.getItem('password');
      if (user === storedUsername && pass === storedPassword) {
        localStorage.setItem('loggedIn', 'true');
        init();
      } else {
        alert('Invalid username or password.');
      }
    });
    document.getElementById('postForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const content = document.getElementById('postText').value.trim();
      const mediaUrl = document.getElementById('postMedia').value.trim();
      const storeId = localStorage.getItem('storeId');
      const username = localStorage.getItem('username');
      if (!content && !mediaUrl) {
        alert('Post content or media URL is required.');
        return;
      }
      fetch(\`\${API_BASE}/posts/\${storeId}\`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, content, mediaUrl })
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById('postForm').reset();
        loadPosts();
      })
      .catch(err => console.error('Error creating post', err));
    });
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
