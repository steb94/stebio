<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Steb.io</title>
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="store.html" id="navMyStore">My Store</a>
        <a href="create-store.html" id="navCreateStore">Create Store</a>
        <a href="create-product.html" id="navCreateProduct">Add Product</a>
        <a href="dashboard.html" id="navDashboard" class="active">Dashboard</a>
        <a href="my-products.html" id="navMyProducts">My Products</a>
        <a href="reviews.html">Reviews</a>
        <a href="support.html">Support</a>
        <a href="#" id="navLogout">Logout</a>
        <a href="login.html" id="navLogin">Sign in</a>
        <a href="signup.html" id="navSignup">Sign up</a>
      </nav>
    </div>
  </header>
  <main class="container" style="padding:2rem 0;">
    <h2>Store Dashboard</h2>
    <div id="storeInfo" style="margin-bottom:2rem;"></div>
    <div id="stats" class="row g-3" style="margin-bottom:2rem;"></div>
    <div id="actions" style="margin-bottom:2rem;">
      <a href="create-product.html" class="button">Add New Product</a>
      <a href="my-products.html" class="button" style="margin-left:1rem;">View My Products</a>
    </div>
  </main>
  <script src="auth.js"></script>
  <script>
    (function() {
      const API_BASE = document.querySelector('meta[name=\"steb-api-base\"]').getAttribute('content') || '/api';
      document.addEventListener('DOMContentLoaded', () => {
        const loggedIn = localStorage.getItem('loggedIn') === 'true';
        const role = localStorage.getItem('role');
        const storeId = localStorage.getItem('storeId');
        if (!loggedIn) {
          window.location.href = 'login.html';
          return;
        }
        if (role !== 'seller') {
          alert('Only sellers can view the dashboard.');
          window.location.href = 'index.html';
          return;
        }
        if (!storeId) {
          alert('You need to create a store first.');
          window.location.href = 'create-store.html';
          return;
        }
        loadStore();
        loadStats();
      });
      async function loadStore() {
        const storeId = localStorage.getItem('storeId');
        try {
          const res = await fetch(`${API_BASE}/stores/${storeId}`, {
            headers: {
              'Authorization': 'Bearer ' + (localStorage.getItem('token') || '')
            }
          });
          const contentType = res.headers.get('content-type') || '';
          let data = null;
          if (contentType.includes('application/json')) {
            try { data = await res.json(); } catch { data = null; }
          } else {
            await res.text();
          }
          if (!res.ok) {
            throw new Error((data && (data.error || data.message)) || res.statusText || 'Failed to load store details');
          }
          const info = document.getElementById('storeInfo');
          info.innerHTML = `
            <h3>${data.name}</h3>
            <p>${data.description || ''}</p>
          `;
        } catch (err) {
          document.getElementById('storeInfo').innerHTML = '';
          alert(err.message || 'Error loading store');
        }
      }
      async function loadStats() {
        const storeId = localStorage.getItem('storeId');
        try {
          const res = await fetch(`${API_BASE}/stats?storeId=${encodeURIComponent(storeId)}`, {
            headers: {
              'Authorization': 'Bearer ' + (localStorage.getItem('token') || '')
            }
          });
          const contentType = res.headers.get('content-type') || '';
          let data = null;
          if (contentType.includes('application/json')) {
            try { data = await res.json(); } catch { data = null; }
          } else {
            await res.text();
          }
          if (!res.ok) {
            throw new Error((data && (data.error || data.message)) || res.statusText || 'Failed to load stats');
          }
          const statsEl = document.getElementById('stats');
          statsEl.innerHTML = '';
          const makeCard = (title, value) => {
            const col = document.createElement('div');
            col.className = 'col-md-4';
            col.innerHTML = `
              <div class=\"card\">
                <h3>${value}</h3>
                <p>${title}</p>
              </div>
            `;
            statsEl.appendChild(col);
          };
          makeCard('Products', data.totalProducts || 0);
          makeCard('Orders', data.totalOrders || 0);
          makeCard('Revenue', data.totalRevenue ? '$' + Number(data.totalRevenue).toFixed(2) : '$0.00');
        } catch (err) {
          alert(err.message || 'Error loading stats');
        }
      }
    })();
  </script>
</body>
</html>
