<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seller Dashboard – Steb.io</title>

  <!-- API base: override this content attribute if your API is hosted elsewhere -->
  <meta name="steb-api-base" content="/api" />

  <style>
    :root{
      --bg:#0b0b0d; --fg:#fff; --muted:#b9b9c3; --card:#131318;
      --accent:#6ee7ff; --border:#2a2a35; --danger:#ff5a6d;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    .container{max-width:1100px;margin:0 auto;padding:0 1rem}
    header{border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,11,13,.9);backdrop-filter:blur(8px);z-index:10}
    .nav{display:flex;align-items:center;justify-content:space-between;height:64px}
    .brand{font-weight:800;letter-spacing:.3px}
    nav a{color:var(--muted);text-decoration:none;margin:0 .6rem}
    nav a:hover{color:var(--fg)}
    .button{
      background:var(--accent);color:#001219;border:0;border-radius:10px;
      padding:.65rem 1rem;font-weight:700;cursor:pointer
    }
    .button[disabled]{opacity:.6;cursor:not-allowed}
    .ghost{background:transparent;border:1px solid var(--border);color:var(--fg)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem}
    .stack{display:flex;flex-direction:column;gap:.75rem}
    .row{display:flex;gap:1rem;flex-wrap:wrap}
    input[type="text"],input[type="password"],input[type="number"],input[type="url"],textarea{
      width:100%;padding:.65rem .75rem;border:1px solid var(--border);
      border-radius:10px;background:#0f0f14;color:var(--fg);resize:vertical
    }
    textarea{min-height:80px}
    label{font-size:.875rem;color:var(--muted)}
    table{width:100%;border-collapse:collapse;color:var(--fg)}
    th,td{padding:.6rem .75rem;border-bottom:1px solid var(--border)}
    th{text-align:left;font-weight:700}
    tbody tr:hover{background:#1a1a22}
    .summary .value{font-size:1.5rem;font-weight:700;margin-top:.25rem}
    .post{padding:.6rem .75rem;border-bottom:1px solid var(--border)}
    .post:last-child{border-bottom:0}
    .post p{margin:0 0 .5rem 0}
    .post small{color:var(--muted)}
  </style>
</head>
<body>
<header id="top-nav">
  <div class="container nav">
    <div class="brand">Steb.io</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="create-store.html">Create Store</a>
      <a href="add-product.html">Add Product</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="support.html">Support</a>
    </nav>
    <div id="authLinks"></div>
  </div>
</header>

<main class="container" style="padding:1.5rem 0 3rem;">
  <!-- Login Section -->
  <section id="loginSection" class="card stack" style="max-width:420px;margin:2rem auto;">
    <h2>Sign In to Your Dashboard</h2>
    <form id="dashLoginForm" class="stack">
      <div class="stack">
        <label for="dashUsername">Username</label>
        <input id="dashUsername" type="text" placeholder="Your username" required />
      </div>
      <div class="stack">
        <label for="dashPassword">Password</label>
        <input id="dashPassword" type="password" placeholder="Your password" required />
      </div>
      <button type="submit" class="button">Sign In</button>
    </form>
  </section>

  <!-- Dashboard Content -->
  <section id="dashboardContent" style="display:none;">
    <h2>Seller Dashboard</h2>

    <!-- Summary Cards -->
    <div class="row summary" style="margin-top:1rem;">
      <div class="card" style="flex:1;min-width:220px;">
        <div>Total Sales ($)</div>
        <div class="value" id="dashTotalSales">0</div>
      </div>
      <div class="card" style="flex:1;min-width:220px;">
        <div>Total Orders</div>
        <div class="value" id="dashTotalOrders">0</div>
      </div>
      <div class="card" style="flex:1;min-width:220px;">
        <div>Total Products</div>
        <div class="value" id="dashTotalProducts">0</div>
      </div>
    </div>

    <!-- Orders Section -->
    <section style="margin-top:2rem;">
      <h3>Your Orders</h3>
      <div class="card">
        <table id="ordersTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Product</th>
              <th>Buyer</th>
              <th>Price ($)</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- Chat Rooms Section -->
    <section style="margin-top:2rem;">
      <h3>Your Chat Rooms</h3>
      <div id="chatRoomList" class="stack"></div>
      <div class="card" style="margin-top:1rem;">
        <h4>Create Chat Room</h4>
        <form id="chatRoomForm" class="stack">
          <div class="stack">
            <label for="chatRoomTitle">Title</label>
            <input id="chatRoomTitle" type="text" placeholder="Chat room title" required />
          </div>
          <div class="stack">
            <label for="chatRoomPrice">Price</label>
            <input id="chatRoomPrice" type="number" step="0.01" min="0" placeholder="0.00" />
          </div>
          <button type="submit" class="button">Create Chat Room</button>
        </form>
      </div>
    </section>

    <!-- Posts Section -->
    <section style="margin-top:2rem;">
      <h3>Your Store Posts</h3>
      <div id="postList" class="card" style="padding:0;"></div>
      <div class="card" style="margin-top:1rem;">
        <h4>Create Post</h4>
        <form id="postForm" class="stack">
          <div class="stack">
            <label for="postText">Post Text</label>
            <textarea id="postText" placeholder="Write your update…" rows="3"></textarea>
          </div>
          <div class="stack">
            <label for="postMedia">Media URL (optional)</label>
            <input id="postMedia" type="url" placeholder="https://example.com/image.png" />
          </div>
          <button type="submit" class="button">Post</button>
        </form>
      </div>
    </section>
  </section>
</main>

<script>
(() => {
  // Configure API base from meta tag
  const metaBase = document.querySelector('meta[name="steb-api-base"]');
  const API_BASE = (metaBase && metaBase.content) ? metaBase.content.replace(/\/+$/, '') : '/api';

  // Helper functions
  const $ = (sel) => document.querySelector(sel);
  const el = (tag, attrs = {}, children = []) => {
    const node = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => {
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else node.setAttribute(k, v);
    });
    children.forEach(child => node.appendChild(child));
    return node;
  };
  const text = (str = '') => document.createTextNode(String(str));

  // API wrapper with auth support
  async function api(path, opts = {}) {
    const token = localStorage.getItem('steb_token');
    const headers = Object.assign({ 'Accept': 'application/json' }, opts.headers || {});
    if (!(opts.body instanceof FormData)) {
      headers['Content-Type'] = headers['Content-Type'] || 'application/json';
    }
    if (token) headers['Authorization'] = \`Bearer \${token}\`;
    const res = await fetch(\`\${API_BASE}\${path}\`, { credentials:'include', ...opts, headers });
    const ct = res.headers.get('content-type') || '';
    let data = null;
    if (ct.includes('application/json')) {
      try { data = await res.json(); } catch {}
    } else {
      data = await res.text().catch(() => null);
    }
    if (!res.ok) {
      const msg = (data && (data.error || data.message)) || res.statusText || 'Request failed';
      const err = new Error(msg);
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  // Navbar auth control
  function renderAuth() {
    const wrap = $('#authLinks');
    wrap.innerHTML = '';
    const isLoggedIn = localStorage.getItem('loggedIn') === 'true';
    if (isLoggedIn) {
      const btn = el('button', { class:'button ghost', type:'button' }, [ text('Sign out') ]);
      btn.onclick = () => {
        localStorage.removeItem('loggedIn');
        localStorage.removeItem('steb_token');
        location.reload();
      };
      wrap.appendChild(btn);
    } else {
      const link = el('a', { href:'login.html', class:'button ghost' }, [ text('Sign in') ]);
      wrap.appendChild(link);
    }
  }

  // UI toggles
  function showLogin() {
    $('#loginSection').style.display = 'block';
    $('#dashboardContent').style.display = 'none';
  }
  function showDashboard() {
    $('#loginSection').style.display = 'none';
    $('#dashboardContent').style.display = 'block';
  }

  // Load dashboard summary
  async function loadSummary() {
    try {
      const data = await api('/dashboard');
      $('#dashTotalSales').textContent = Number(data.totalSales || 0).toFixed(2);
      $('#dashTotalOrders').textContent = data.totalOrders || 0;
      $('#dashTotalProducts').textContent = data.totalProducts || 0;
    } catch (e) {
      console.error('Error loading summary', e);
    }
  }

  // Load orders
  async function loadOrders() {
    const tbody = $('#ordersTable tbody');
    tbody.innerHTML = '';
    try {
      const orders = await api('/orders');
      (orders || []).forEach(o => {
        const tr = document.createElement('tr');
        tr.innerHTML = \`
          <td>\${o.id}</td>
          <td>\${o.productName}</td>
          <td>\${o.buyerName}</td>
          <td>\${Number(o.price).toFixed(2)}</td>
          <td>\${o.status}</td>
        \`;
        tbody.appendChild(tr);
      });
    } catch (e) {
      console.error('Error loading orders', e);
    }
  }

  // Load posts
  async function loadPosts() {
    const storeId = localStorage.getItem('storeId');
    const username = localStorage.getItem('username');
    const list = $('#postList');
    list.innerHTML = '';
    if (!storeId || !username) return;
    try {
      const data = await api(\`/posts/\${encodeURIComponent(storeId)}?username=\${encodeURIComponent(username)}\`);
      const posts = (data && data.posts) || [];
      if (posts.length === 0) {
        list.innerHTML = '<div class=\"post\"><p>No posts yet.</p></div>';
      } else {
        posts.forEach(p => {
          const div = el('div', { class:'post' });
          if (p.content) {
            div.appendChild(el('p', {}, [ text(p.content) ]));
          }
          if (p.mediaUrl) {
            const link = el('a', { href:p.mediaUrl, target:'_blank', style:'color:var(--accent);text-decoration:underline' }, [ text('Media') ]);
            const wrapper = el('div', {}, [ link ]);
            div.appendChild(wrapper);
          }
          const date = new Date(p.timestamp || p.createdAt);
          div.appendChild(el('small', {}, [ text(date.toLocaleString()) ]));
          list.appendChild(div);
        });
      }
    } catch (e) {
      console.error('Error loading posts', e);
    }
  }

  // Load chat rooms
  async function loadChatRooms() {
    const storeId = localStorage.getItem('storeId');
    const list = $('#chatRoomList');
    list.innerHTML = '';
    if (!storeId) return;
    try {
      const data = await api(\`/chatrooms/\${encodeURIComponent(storeId)}\`);
      (data.rooms || []).forEach(room => {
        const card = el('div', { class:'card' }, [
          el('div', {}, [
            el('strong', {}, [ text(room.title) ]),
            text(' – '),
            text(room.price > 0 ? '$' + Number(room.price).toFixed(2) : 'Free')
          ]),
          el('div', { style:'margin-top:.5rem' }, [
            el('a', { href:\`chatroom.html?id=\${room.id}\`, class:'button ghost' }, [ text('Open') ])
          ])
        ]);
        list.appendChild(card);
      });
    } catch (e) {
      console.error('Error loading chat rooms', e);
    }
  }

  // Initialize dashboard logic
  function initDashboard() {
    const loggedIn = localStorage.getItem('loggedIn') === 'true';
    const role = localStorage.getItem('role');
    if (!loggedIn) {
      showLogin();
      return;
    }
    if (role !== 'seller') {
      alert('You are not a seller. Please sign in with a seller account.');
      showLogin();
      return;
    }
    const storeId = localStorage.getItem('storeId');
    if (!storeId) {
      alert('Please create a store first.');
      window.location.href = 'create-store.html';
      return;
    }
    showDashboard();
    renderAuth();
    loadSummary();
    loadOrders();
    loadChatRooms();
    loadPosts();
  }

  // Event handlers
  $('#dashLoginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const user = $('#dashUsername').value.trim();
    const pass = $('#dashPassword').value.trim();
    const storedUser = localStorage.getItem('username');
    const storedPass = localStorage.getItem('password');
    if (user === storedUser && pass === storedPass) {
      localStorage.setItem('loggedIn', 'true');
      initDashboard();
    } else {
      alert('Invalid username or password.');
    }
  });

  $('#postForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const content = $('#postText').value.trim();
    const mediaUrl = $('#postMedia').value.trim();
    const storeId = localStorage.getItem('storeId');
    const username = localStorage.getItem('username');
    if (!content && !mediaUrl) {
      alert('Post content or media URL is required.');
      return;
    }
    try {
      await api(\`/posts/\${encodeURIComponent(storeId)}\`, {
        method:'POST',
        body: JSON.stringify({ username, content, mediaUrl })
      });
      $('#postForm').reset();
      loadPosts();
    } catch (err) {
      console.error('Error creating post', err);
    }
  });

  $('#chatRoomForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = $('#chatRoomTitle').value.trim();
    const price = parseFloat($('#chatRoomPrice').value) || 0;
    const storeId = localStorage.getItem('storeId');
    if (!title) {
      alert('Please enter a chat room title.');
      return;
    }
    try {
      await api('/chatrooms', {
        method:'POST',
        body: JSON.stringify({ storeId, title, price })
      });
      $('#chatRoomForm').reset();
      loadChatRooms();
    } catch (err) {
      console.error('Error creating chat room', err);
    }
  });

  // Initialise on DOM ready
  document.addEventListener('DOMContentLoaded', () => {
    renderAuth();
    initDashboard();
  });
})();
</script>
</body>
</html>
