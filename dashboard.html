<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Steb.io</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Explore Marketplace</a>
        <a href="start-selling.html">Create Store</a>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="#">Support</a>
      </nav>
      <div class="auth-links">
        <a href="#" id="login-link">Sign In</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 2rem 0;">
    <!-- Login section: shown when user is not signed in -->
    <section id="loginSection" style="display:none; text-align:center; margin-top:2rem;">
      <h2>Sign In to Your Dashboard</h2>
      <p>Please sign in to view your store statistics and manage your orders.</p>
      <div style="margin-bottom:1rem;">
        <input type="text" id="usernameInput" placeholder="Username" style="padding:0.5rem; width:200px;" />
      </div>
      <div style="margin-bottom:1rem;">
        <input type="password" id="passwordInput" placeholder="Password" style="padding:0.5rem; width:200px;" />
      </div>
      <button id="loginBtn" style="padding:0.5rem 1rem;">Sign In</button>
    </section>

    <!-- Dashboard summary: hidden until user is signed in -->
    <section id="dashboardSummary" style="display:none;">
      <h2>Seller Dashboard</h2>
      <div class="summary-cards">
        <div class="summary-card">
          <div class="value" id="dashTotalSales">0</div>
          <div class="label">Total Sales ($)</div>
        </div>
        <div class="summary-card">
          <div class="value" id="dashTotalOrders">0</div>
          <div class="label">Total Orders</div>
        </div>
        <div class="summary-card">
          <div class="value" id="dashTotalProducts">0</div>
          <div class="label">Total Products</div>
        </div>
      </div>
    </section>

    <!-- Chart section: hidden until user is signed in -->
    <section id="dashboardChart" style="display:none; margin-top:2rem;">
      <h3>Sales overview</h3>
      <canvas id="salesChart" width="400" height="200"></canvas>
    </section>

    <!-- Orders section: hidden until user is signed in -->
    <section id="dashboardOrders" style="display:none; margin-top:2rem;">
      <h3>Orders</h3>
      <div style="overflow-x:auto;">
        <table id="ordersTable" class="orders-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Product</th>
              <th>Price ($)</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Chart.js library -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Determine API base URL. Use the backend domain on render or /api locally.
    const API_BASE = window.location.hostname.includes('onrender.com')
      ? 'https://stebio.onrender.com/api'
      : '/api';

    // Fetch dashboard summary
    async function loadDashboard() {
      try {
        const res = await fetch(\`\${API_BASE}/dashboard\`);
        const data = await res.json();
        document.getElementById('dashTotalSales').textContent = data.totalSales.toFixed(2);
        document.getElementById('dashTotalOrders').textContent = data.totalOrders;
        document.getElementById('dashTotalProducts').textContent = data.totalProducts;
      } catch (err) {
        console.error('Error loading dashboard summary', err);
      }
    }

    // Fetch orders and render table
    async function loadOrders() {
      try {
        const res = await fetch(\`\${API_BASE}/orders\`);
        const orders = await res.json();
        const tbody = document.querySelector('#ordersTable tbody');
        tbody.innerHTML = '';
        orders.forEach((o) => {
          const tr = document.createElement('tr');
          tr.innerHTML = \`
            <td>\${o.id}</td>
            <td>\${o.productName}</td>
            <td>\${o.price.toFixed(2)}</td>
            <td><span class="order-status">\${o.status}</span></td>
            <td>
              <select data-id="\${o.id}" class="status-select">
                <option value="Processing" \${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                <option value="Completed" \${o.status === 'Completed' ? 'selected' : ''}>Completed</option>
                <option value="Cancelled" \${o.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
            </td>
          \`;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Error loading orders', err);
      }
    }

    // Handle status change
    document.addEventListener('change', (e) => {
      if (e.target.classList.contains('status-select')) {
        const id = e.target.getAttribute('data-id');
        const newStatus = e.target.value;
        fetch(\`\${API_BASE}/orders/\${id}\`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        })
          .then(res => res.json())
          .then(() => {
            // update status text
            const statusSpan = e.target.parentElement.previousElementSibling.querySelector('.order-status');
            statusSpan.textContent = newStatus;
          })
          .catch(err => console.error('Error updating order', err));
      }
    });

    // Render sales chart with dummy monthly data
    function renderChart() {
      const ctx = document.getElementById('salesChart');
      const labels = ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];
      const data = {
        labels: labels,
        datasets: [
          {
            label: 'Orders',
            data: labels.map(() => Math.floor(Math.random() * 8) + 2),
            backgroundColor: 'rgba(102, 126, 234, 0.6)',
            borderColor: 'rgba(102, 126, 234, 1)',
            borderWidth: 1
          }
        ]
      };
      new Chart(ctx, {
        type: 'bar',
        data: data,
        options: {
          scales: {
            y: {
              beginAtZero: true,
              title: { display: true, text: 'Number of Orders' }
            },
            x: {
              title: { display: true, text: 'Month' }
            }
          },
          plugins: {
            title: { display: true, text: 'Monthly Orders' }
          }
        }
      });
    }

    // Initialize dashboard depending on login state
    function initDashboard() {
      const loggedIn = localStorage.getItem('loggedIn') === 'true';
      const role = localStorage.getItem('role') || 'buyer';
      const loginSection = document.getElementById('loginSection');
      const summarySection = document.getElementById('dashboardSummary');
      const chartSection = document.getElementById('dashboardChart');
      const ordersSection = document.getElementById('dashboardOrders');
      if (!loggedIn) {
        loginSection.style.display = 'block';
        summarySection.style.display = 'none';
        chartSection.style.display = 'none';
        ordersSection.style.display = 'none';
      } else {
        loginSection.style.display = 'none';
        if (role !== 'seller') {
          summarySection.style.display = 'none';
          chartSection.style.display = 'none';
          ordersSection.style.display = 'none';
        } else {
          summarySection.style.display = 'block';
          chartSection.style.display = 'block';
          ordersSection.style.display = 'block';
          loadDashboard();
          loadOrders();
          renderChart();
        }
      }
    }

    // Login button handler
    document.getElementById('loginBtn').addEventListener('click', () => {
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      if (!usernameInput || !passwordInput ||
          usernameInput.value.trim() === '' ||
          passwordInput.value.trim() === '') {
        alert('Please enter a username and password to sign in.');
        return;
      }
      const storedUsername = localStorage.getItem('username');
      const storedPassword = localStorage.getItem('password');
      if (storedUsername === usernameInput.value.trim() &&
          storedPassword === passwordInput.value.trim()) {
        localStorage.setItem('loggedIn', 'true');
        location.reload();
      } else {
        alert('Invalid username or password.');
      }
    });

    // Initialize on page load
    initDashboard();
  </script>
  <script src="auth.js"></script>
</body>
</html>
