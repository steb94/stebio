<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details – Steb.io</title>
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="store.html" id="navMyStore">My Store</a>
        <a href="create-store.html" id="navCreateStore">Create Store</a>
        <a href="create-product.html" id="navCreateProduct">Add Product</a>
        <a href="dashboard.html" id="navDashboard">Dashboard</a>
        <a href="my-products.html" id="navMyProducts">My Products</a>
        <a href="reviews.html">Reviews</a>
        <a href="support.html">Support</a>
        <a href="#" id="navLogout">Logout</a>
        <a href="login.html" id="navLogin">Sign in</a>
        <a href="signup.html" id="navSignup">Sign up</a>
      </nav>
    </div>
  </header>
  <main class="container" style="padding:2rem 0; max-width:800px;">
    <div id="productContainer">
      <!-- Product details will be injected here -->
    </div>
  </main>
  <script src="auth.js"></script>
  <script>
    (function() {
      const API_BASE = document.querySelector('meta[name="steb-api-base"]').getAttribute('content') || '/api';
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (!id) {
          document.getElementById('productContainer').innerHTML = '<p>Product not found.</p>';
          return;
        }
        loadProduct(id);
      });
      async function loadProduct(id) {
        try {
          const res = await fetch(`${API_BASE}/products/${encodeURIComponent(id)}`);
          const contentType = res.headers.get('content-type') || '';
          let data = null;
          if (contentType.includes('application/json')) {
            try { data = await res.json(); } catch { data = null; }
          } else {
            await res.text();
          }
          if (!res.ok) {
            throw new Error((data && (data.error || data.message)) || res.statusText || 'Failed to load product');
          }
          renderProduct(data);
        } catch (err) {
          document.getElementById('productContainer').innerHTML = `<p>${err.message || 'Error loading product'}</p>`;
        }
      }
      function renderProduct(prod) {
        const container = document.getElementById('productContainer');
        // Build pricing list
        let pricingHtml = '';
        if (Array.isArray(prod.pricing) && prod.pricing.length > 0) {
          pricingHtml += '<ul style="list-style:none; padding-left:0; margin:0;">';
          prod.pricing.forEach(tier => {
            const p = Number(tier.price || 0).toFixed(2);
            let desc = '';
            if (tier.type === 'free') {
              desc = 'Free';
            } else if (tier.type === 'one-time') {
              desc = '$' + p + ' one-time';
            } else {
              desc = '$' + p + ' / ' + tier.interval;
            }
            const label = tier.label || (tier.type === 'free' ? 'Free' : 'Plan');
            pricingHtml += `<li>${label}: ${desc}</li>`;
          });
          pricingHtml += '</ul>';
        } else {
          const price = Number(prod.price || 0).toFixed(2);
          pricingHtml = `<p><strong>Price:</strong> $${price}</p>`;
        }
        const imgSrc = prod.imageUrl && prod.imageUrl.trim()
          ? (prod.imageUrl.match(/^https?:\/\//) ? prod.imageUrl : prod.imageUrl)
          : 'https://via.placeholder.com/600x300?text=Product';
        // Build features list
        let featuresHtml = '';
        if (Array.isArray(prod.features) && prod.features.length > 0) {
          featuresHtml += '<h4>Features</h4><ul style="padding-left:1rem;">';
          prod.features.forEach(f => {
            featuresHtml += `<li>${f}</li>`;
          });
          featuresHtml += '</ul>';
        }
        // Build FAQs list
        let faqsHtml = '';
        if (Array.isArray(prod.faqs) && prod.faqs.length > 0) {
          faqsHtml += '<h4>FAQs</h4><div>';
          prod.faqs.forEach(faq => {
            faqsHtml += `<p><strong>${faq.question}</strong><br>${faq.answer}</p>`;
          });
          faqsHtml += '</div>';
        }
        container.innerHTML = `
          <div class="card" style="overflow:hidden;">
            <img src="${imgSrc}" alt="${prod.title}" style="height:250px; object-fit:cover; width:100%;" />
            <div style="padding:1rem;">
              <h2>${prod.title}</h2>
              <p><strong>Type:</strong> ${prod.type}</p>
              <div>${pricingHtml}</div>
              <p>${prod.description || ''}</p>
              ${featuresHtml}
              ${faqsHtml}
              <button id="buyButton" class="button">Buy Now</button>
            </div>
          </div>
        `;
        const buyBtn = document.getElementById('buyButton');
        buyBtn.addEventListener('click', async function() {
          // Attempt to purchase; for now we just simulate checkout.
          const loggedIn = localStorage.getItem('loggedIn') === 'true';
          if (!loggedIn) {
            alert('Please sign in to purchase this product.');
            window.location.href = 'login.html';
            return;
          }
          try {
            const res = await fetch(`${API_BASE}/products/${encodeURIComponent(prod.id)}/checkout`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + (localStorage.getItem('token') || '')
              },
              body: JSON.stringify({ quantity: 1 })
            });
            const contentType = res.headers.get('content-type') || '';
            let data = null;
            if (contentType.includes('application/json')) {
              try { data = await res.json(); } catch { data = null; }
            } else {
              await res.text();
            }
            if (!res.ok) {
              throw new Error((data && (data.error || data.message)) || res.statusText || 'Purchase failed');
            }
            alert((data && data.message) || 'Purchase successful!');
          } catch (err) {
            alert(err.message || 'Error during purchase');
          }
        });
      }
    })();
  </script>
</body>
</html>
