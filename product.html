<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Product Details - Steb.io</title>
  <!-- Link to your shared stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top navigation -->
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="create-store.html">Create Store</a>
        <a href="create-product.html">Add Product</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="auth-links"><a href="login.html" class="button ghost">Sign in</a></div>
    </div>
  </header>

  <!-- Product details will be injected here -->
  <main id="productContainer" class="container" style="padding:2rem 0;"></main>

  <!-- Chat UI for logged‑in users -->
  <section id="productChat" class="container" style="display:none; margin-top:1rem;">
    <h3>Product Chat</h3>
    <div id="chatMessages" style="max-height:300px; overflow-y:auto; border:1px solid var(--border); padding:0.5rem; background: var(--secondary);"></div>
    <form id="chatForm" style="margin-top:0.5rem; display:flex; gap:0.5rem;">
      <input id="chatInput" type="text" placeholder="Type your message..." style="flex:1;" />
      <button type="submit" class="button">Send</button>
    </form>
  </section>

  <!-- List of store chat rooms (even for guests) -->
  <section id="storeChatRooms" class="container" style="margin-top:1rem;">
    <h3>Store Chat Rooms</h3>
    <div id="storeChatRoomsList"></div>
  </section>

  <!-- Shared auth utilities -->
  <script src="auth.js"></script>
  <script>
    // Determine API base based on environment
    const API_BASE = window.location.hostname.includes('onrender.com')
      ? 'https://stebio.onrender.com/api'
      : '/api';

    /**
     * Load and render product details based on the "id" query parameter.
     * Also triggers chat loading and chat room listing once the product is fetched.
     */
    function loadProduct() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const container = document.getElementById('productContainer');
      if (!id) {
        container.innerHTML = '<p>Missing product ID.</p>';
        return;
      }
      fetch(`${API_BASE}/products/${id}`)
        .then(res => {
          if (!res.ok) throw new Error('Product not found');
          return res.json();
        })
        .then(p => {
          // Build product card
          const wrapper = document.createElement('div');
          wrapper.style.display = 'flex';
          wrapper.style.flexWrap = 'wrap';
          wrapper.style.gap = '2rem';

          // Image (falls back to placeholder)
          const img = document.createElement('img');
          let imgSrc = p.image && p.image.trim() !== '' ? p.image : null;
          if (imgSrc && !/^https?:\/\//.test(imgSrc) && !/^data:/.test(imgSrc)) {
            // If relative path, construct raw URL from GitHub branch
            imgSrc = 'https://raw.githubusercontent.com/steb94/stebio/backend/server-.-js/' + imgSrc;
          }
          img.src = imgSrc || 'https://via.placeholder.com/500x280?text=Product';
          img.alt = p.title;
          img.style.width = '100%';
          img.style.maxWidth = '500px';
          img.style.borderRadius = '8px';

          // Product info
          const info = document.createElement('div');
          info.style.flex = '1';
          info.innerHTML = `
            <h2>${p.title}</h2>
            <p><strong>Type:</strong> ${p.type}</p>
            <p style="font-size:1.5rem; margin:1rem 0;">$${p.price.toFixed(2)}</p>
            <p>${p.description}</p>
            <p><a href="store.html?id=${p.storeId}" style="color:${getComputedStyle(document.documentElement).getPropertyValue('--primary-dark')}">View Seller Store</a></p>
            <button class="button" onclick="alert('Order functionality not implemented yet.')">Buy Now</button>
          `;

          wrapper.appendChild(img);
          wrapper.appendChild(info);
          container.appendChild(wrapper);

          // After rendering the product, load chat and chat rooms
          loadChat(id);
          loadStoreChatRooms(p.storeId);
        })
        .catch(() => {
          container.innerHTML = '<p>Product not found.</p>';
        });
    }

    /**
     * Load chat messages for a product if the user is logged in.
     * Hides the chat UI for guests.
     * @param {string|number} productId
     */
    function loadChat(productId) {
      const username = localStorage.getItem('username');
      if (!username) return;
      fetch(`${API_BASE}/chat/${productId}/messages?username=${encodeURIComponent(username)}`)
        .then(res => {
          if (res.status === 403 || res.status === 401) {
            document.getElementById('productChat').style.display = 'none';
            return null;
          }
          return res.json();
        })
        .then(data => {
          if (!data) return;
          document.getElementById('productChat').style.display = '';
          const messages = data.messages || [];
          const chatMessages = document.getElementById('chatMessages');
          chatMessages.innerHTML = '';
          messages.forEach(m => {
            const div = document.createElement('div');
            div.innerHTML = `<strong>${m.username}</strong>: ${m.message} <small>${new Date(m.createdAt || m.timestamp).toLocaleString()}</small>`;
            chatMessages.appendChild(div);
          });
          chatMessages.scrollTop = chatMessages.scrollHeight;
        })
        .catch(err => console.error('Error loading chat messages', err));
    }

    /**
     * Fetch and render the list of chat rooms associated with a store.
     * Display each room with its title, price, and a link to join.
     * @param {string|number} storeId
     */
    function loadStoreChatRooms(storeId) {
      fetch(`${API_BASE}/chatrooms/${storeId}`)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById('storeChatRoomsList');
          list.innerHTML = '';
          (data.rooms || []).forEach(room => {
            const div = document.createElement('div');
            div.style.border = '1px solid var(--border)';
            div.style.padding = '0.5rem';
            div.style.marginBottom = '0.5rem';
            div.innerHTML = `
              <strong>${room.title}</strong> – 
              ${room.price > 0 ? '$' + room.price.toFixed(2) : 'Free'}
              <a href="chatroom.html?id=${room.id}" style="margin-left:1rem;">
                ${room.price > 0 ? 'Join' : 'Enter'}
              </a>
            `;
            list.appendChild(div);
          });
        })
        .catch(err => console.error('Error loading store chat rooms', err));
    }

    // Submit handler for sending a chat message
    document.getElementById('chatForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');
      const username = localStorage.getItem('username');
      const message = document.getElementById('chatInput').value.trim();
      if (!message) return;
      fetch(`${API_BASE}/chat/${productId}/message`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, message })
      })
        .then(res => {
          if (!res.ok) throw new Error('Failed to send message');
          return res.json();
        })
        .then(() => {
          document.getElementById('chatInput').value = '';
          loadChat(productId);
        })
        .catch(err => console.error('Error sending message', err));
    });

    // Initialize product view when the page loads
    document.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
