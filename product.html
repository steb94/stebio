<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Product Details - Steb.io</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <span id="navLinks" style="display:none;">
          <a href="create-store.html">Create Store</a>
          <a href="create-product.html">Add Product</a>
          <a href="dashboard.html">Dashboard</a>
        </span>
        <a href="support.html">Support</a>
        <a href="reviews.html">Reviews</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main id="productContainer" class="container" style="padding:2rem 0;"></main>

  <section id="productChat" class="container" style="display:none; margin-top:1rem;">
    <h3>Product Chat</h3>
    <div id="chatMessages" class="messages"></div>
    <form id="chatForm" style="margin-top:0.5rem; display:flex; gap:0.5rem;">
      <input id="chatInput" type="text" placeholder="Type your message..." style="flex:1;" />
      <button type="submit" class="button">Send</button>
    </form>
  </section>

  <section id="storeChatRooms" class="container" style="margin-top:1rem;">
    <h3>Store Chat Rooms</h3>
    <div id="storeChatRoomsList"></div>
  </section>

  <script src="auth.js"></script>
  <script>
    const API_BASE = window.location.hostname.includes('onrender.com')
      ? 'https://stebio.onrender.com/api'
      : '/api';

    function loadProduct() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const container = document.getElementById('productContainer');
      if (!id) {
        container.innerHTML = '<p>Missing product ID.</p>';
        return;
      }
      fetch(`${API_BASE}/products/${id}`)
        .then(res => {
          if (!res.ok) throw new Error('Product not found');
          return res.json();
        })
        .then(p => {
          const wrapper = document.createElement('div');
          wrapper.style.display = 'flex';
          wrapper.style.flexWrap = 'wrap';
          wrapper.style.gap = '2rem';
          const img = document.createElement('img');
          let imgSrc = p.image && p.image.trim() !== '' ? p.image : null;
          if (imgSrc && !/^https?:\/\//.test(imgSrc) && !/^data:/.test(imgSrc)) {
            imgSrc = 'https://raw.githubusercontent.com/steb94/stebio/backend/server-.-js/' + imgSrc;
          }
          img.src = imgSrc || 'https://via.placeholder.com/500x280?text=Product';
          img.alt = p.title;
          img.style.width = '100%';
          img.style.maxWidth = '500px';
          img.style.borderRadius = '8px';
          const info = document.createElement('div');
          info.style.flex = '1';
          const priceLine = p.type === 'ChatRoom'
            ? `Chat Room Fee: $${p.price.toFixed(2)}`
            : `Price: $${p.price.toFixed(2)}`;
          info.innerHTML = `
            <h2>${p.title}</h2>
            <p><strong>Type:</strong> ${p.type}</p>
            <p style="font-size:1.5rem; margin:1rem 0;">${priceLine}</p>
            <p>${p.description}</p>
            <p><a href="store.html?id=${p.storeId}" style="color:${getComputedStyle(document.documentElement).getPropertyValue('--accent')}">View Seller Store</a></p>
          `;
          if (p.type === 'ChatRoom') {
            const joinLink = document.createElement('a');
            joinLink.href = `chatroom.html?id=${p.chatRoomId}`;
            joinLink.className = 'button';
            joinLink.textContent = p.price > 0 ? 'Purchase and Join Chat' : 'Enter Chat Room';
            info.appendChild(joinLink);
          } else {
            const buyBtn = document.createElement('button');
            buyBtn.className = 'button';
            buyBtn.textContent = 'Buy Now';
            buyBtn.addEventListener('click', () => alert('Order functionality not implemented yet.'));
            info.appendChild(buyBtn);
          }
          wrapper.appendChild(img);
          wrapper.appendChild(info);
          container.appendChild(wrapper);
          loadChat(id);
          loadStoreChatRooms(p.storeId);
        })
        .catch(() => {
          container.innerHTML = '<p>Product not found.</p>';
        });
    }

    function loadChat(productId) {
      const username = localStorage.getItem('username');
      if (!username) return;
      fetch(`${API_BASE}/chat/${productId}/messages?username=${encodeURIComponent(username)}`)
        .then(res => {
          if (res.status === 403 || res.status === 401) {
            document.getElementById('productChat').style.display = 'none';
            return null;
          }
          return res.json();
        })
        .then(data => {
          if (!data) return;
          document.getElementById('productChat').style.display = '';
          const messages = data.messages || [];
          const chatMessages = document.getElementById('chatMessages');
          chatMessages.innerHTML = '';
          messages.forEach(m => {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<div class="meta"><strong>${m.username}</strong><small>${new Date(m.createdAt || m.timestamp).toLocaleString()}</small></div><div class="body">${m.message}</div>`;
            chatMessages.appendChild(div);
          });
          chatMessages.scrollTop = chatMessages.scrollHeight;
        })
        .catch(err => console.error('Error loading chat messages', err));
    }

    function loadStoreChatRooms(storeId) {
      fetch(`${API_BASE}/chatrooms/${storeId}`)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById('storeChatRoomsList');
          list.innerHTML = '';
          (data.rooms || []).forEach(room => {
            const div = document.createElement('div');
            div.className = 'card p-2';
            div.innerHTML = `
              <strong>${room.title}</strong> – ${room.price > 0 ? '$' + room.price.toFixed(2) : 'Free'}
              <a href="chatroom.html?id=${room.id}" class="button ghost" style="margin-left:1rem;">${room.price > 0 ? 'Join' : 'Enter'}</a>`;
            list.appendChild(div);
          });
        })
        .catch(err => console.error('Error loading store chat rooms', err));
    }

    document.getElementById('chatForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');
      const username = localStorage.getItem('username');
      const message = document.getElementById('chatInput').value.trim();
      if (!message) return;
      fetch(`${API_BASE}/chat/${productId}/message`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, message })
      })
        .then(res => {
          if (!res.ok) throw new Error('Failed to send message');
          return res.json();
        })
        .then(() => {
          document.getElementById('chatInput').value = '';
          loadChat(productId);
        })
        .catch(err => console.error('Error sending message', err));
    });

    document.addEventListener('DOMContentLoaded', function() {
      if (localStorage.getItem('loggedIn') === 'true') {
        document.getElementById('navLinks').style.display = '';
      }
      loadProduct();
    });
  </script>
</body>
</html>
