<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Steb.io</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">Steb.io</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>
  <main class="container">
    <div id="productDetails"></div>
    <div id="purchaseSection"></div>
    <div id="contentSection"></div>
    <div id="reviewsSection"></div>
    <div id="reviewFormSection"></div>
    <div id="productError" class="error-message"></div>
  </main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    // get id from query string
    function getProductId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }
    let currentProductId = getProductId();
    let currentProduct = null;
    let hasPurchased = false;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!currentProductId) {
        document.getElementById('productError').textContent = 'No product ID provided';
        return;
      }
      try {
        currentProduct = await getProduct(currentProductId);
        renderProduct();
        // check purchase status if logged in
        const token = localStorage.getItem('token');
        if (token) {
          const purchases = await getPurchases();
          hasPurchased = purchases.some(p => p.id === currentProductId);
        }
        renderPurchaseSection();
        loadReviews();
        if (hasPurchased) {
          loadContent();
          renderReviewForm();
        }
      } catch (err) {
        document.getElementById('productError').textContent = err.error || err.message;
      }
    });

    function renderProduct() {
      const div = document.getElementById('productDetails');
      div.innerHTML = '';
      const p = currentProduct;
      const html = `
        <h2>${p.name}</h2>
        <p><em>Type:</em> ${p.type}</p>
        <p><em>Category:</em> ${p.category || 'N/A'}</p>
        <p>${p.description}</p>
        <p><strong>Price:</strong> $${p.price}</p>
        <p><strong>Rating:</strong> ${p.rating || 'No ratings yet'}</p>
      `;
      div.innerHTML = html;
    }

    function renderPurchaseSection() {
      const section = document.getElementById('purchaseSection');
      section.innerHTML = '';
      const token = localStorage.getItem('token');
      if (!token) {
        section.innerHTML = '<p>You must <a href="login.html">login</a> to purchase this product.</p>';
        return;
      }
      if (hasPurchased) {
        section.innerHTML = '<p>You have purchased this product.</p>';
        return;
      }
      // show buy button
      const btn = document.createElement('button');
      btn.textContent = `Buy for $${currentProduct.price}`;
      btn.addEventListener('click', async () => {
        try {
          const result = await purchaseProduct(currentProductId);
          alert('Purchase successful');
          hasPurchased = true;
          renderPurchaseSection();
          loadContent();
          loadReviews();
          renderReviewForm();
        } catch (err) {
          alert(err.error || err.message);
        }
      });
      section.appendChild(btn);
    }

    async function loadContent() {
      const res = await getProductContent(currentProductId);
      const section = document.getElementById('contentSection');
      section.innerHTML = '';
      if (currentProduct.type === 'digital') {
        section.innerHTML = `<p><strong>Download:</strong> <a href="${res.fileUrl}" target="_blank">Download file</a></p>`;
      }
      if (currentProduct.type === 'membership') {
        section.innerHTML = `<p>${res.membershipBenefits}</p>`;
      }
      if (currentProduct.type === 'course') {
        const list = document.createElement('ol');
        res.courseContent.forEach(lesson => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${lesson.title}:</strong> ${lesson.content}`;
          list.appendChild(li);
        });
        section.appendChild(list);
      }
    }

    async function loadReviews() {
      const reviews = await getReviews(currentProductId);
      const section = document.getElementById('reviewsSection');
      section.innerHTML = '<h3>Reviews</h3>';
      if (reviews.length === 0) {
        section.innerHTML += '<p>No reviews yet.</p>';
        return;
      }
      reviews.forEach(r => {
        const div = document.createElement('div');
        div.classList.add('review');
        div.innerHTML = `<strong>Rating:</strong> ${r.rating}/5 <br/><em>${r.comment}</em> <br/><small>${new Date(r.date).toLocaleDateString()}</small>`;
        section.appendChild(div);
      });
    }

    function renderReviewForm() {
      const section = document.getElementById('reviewFormSection');
      section.innerHTML = '';
      const token = localStorage.getItem('token');
      if (!token || !hasPurchased) return;
      const form = document.createElement('form');
      form.classList.add('form');
      form.innerHTML = `
        <h3>Leave a Review</h3>
        <label>Rating (1-5)</label>
        <input type="number" name="rating" min="1" max="5" required />
        <label>Comment</label>
        <textarea name="comment"></textarea>
        <button type="submit">Submit Review</button>
      `;
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const rating = parseInt(form.rating.value);
        const comment = form.comment.value.trim();
        try {
          await submitReview(currentProductId, rating, comment);
          alert('Review submitted');
          loadReviews();
        } catch (err) {
          alert(err.error || err.message);
        }
      });
      section.appendChild(form);
    }

    // Chat functionality has been removed.  If you later integrate a real‑time
    // chat service, define an initChat() function here that connects to
    // the server and handles message display and sending.
  </script>
</body>
</html>
