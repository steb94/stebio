<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <meta name="steb-api-base" content="/api">
</head>
<body>
  <nav>
    <div class="brand">
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPAAAABQCAIAAACoK28rAAAHm0lEQVR4nO3ce1hTZRwH8HMml20MmYwElItKXBQeBfUBrxl4QY28pSJKVvpEVop5TS0pzTRNxfSxVCzRUsvA9JEyU4PAR1GQKcZlgOCGCFPGZTB2g53+4Il82EEHnO3wvv0+f8G7c7Yv23fnec/ZO0j++CUEALjgsB0AACZBoQFWoNAAK1BogBUoNMAKFBpgBQoNsAKFBliBQgOsQKEBVqDQACtQaIAVKDTAChQaYAUKDbAChQZYgUIDrEChAVag0AArUGiAFSg0wAoUGmAFCg2wAoUGWIFCA6xAoQFWoNAAK1BogBUoNMAKFBpgBQoNsAKFBlj5ByhpavO1TOj6AAAAAElFTT..." alt="Steb Logo" class="logo">
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="store.html" id="navMyStore">My Store</a>
      <a href="create-store.html" id="navCreateStore">Create Store</a>
      <a href="create-product.html" id="navCreateProduct" class="active">Add Product</a>
      <a href="dashboard.html" id="navDashboard">Dashboard</a>
      <a href="my-products.html" id="navMyProducts">My Products</a>
      <a href="login.html" id="navLogin">Login</a>
      <a href="signup.html" id="navSignup">Sign Up</a>
      <a href="#" id="navLogout">Logout</a>
    </div>
  </nav>

  <div class="container" style="max-width:800px;">
    <h2>Create a New Product</h2>
    <form id="productForm">
      <div class="form-group">
        <label for="prodTitle">Product Title</label>
        <input id="prodTitle" type="text" placeholder="e.g. Trading Bot" required>
      </div>
      <div class="form-group">
        <label for="prodDesc">Description</label>
        <textarea id="prodDesc" placeholder="Describe your product…" required></textarea>
      </div>
      <div class="form-group">
        <label for="prodImage">Image URL</label>
        <input id="prodImage" type="url" placeholder="https://example.com/image.jpg">
      </div>
      <div class="form-group">
        <label for="prodVideo">Video URL</label>
        <input id="prodVideo" type="url" placeholder="https://example.com/video.mp4 or https://youtu.be/…">
      </div>
      <button type="submit">Create Product</button>
    </form>
  </div>

  <script src="auth.js"></script>
  <script>
    (function() {
      const API_BASE = document.querySelector('meta[name="steb-api-base"]').getAttribute('content') || '/api';
      document.addEventListener('DOMContentLoaded', () => {
        const loggedIn = localStorage.getItem('loggedIn') === 'true';
        const role = localStorage.getItem('role');
        const storeId = localStorage.getItem('storeId');
        if (!loggedIn) {
          window.location.href = 'login.html';
          return;
        }
        if (role !== 'seller') {
          alert('Only sellers can create products.');
          window.location.href = 'index.html';
          return;
        }
        if (!storeId) {
          alert('You must create a store before adding products.');
          window.location.href = 'create-store.html';
          return;
        }
      });
      document.getElementById('productForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const title       = document.getElementById('prodTitle').value.trim();
        const description = document.getElementById('prodDesc').value.trim();
        const imageUrl    = document.getElementById('prodImage').value.trim();
        const videoUrl    = document.getElementById('prodVideo').value.trim();
        const payload = { name: title, description, price: 0 };
        if (imageUrl) payload.imageUrl = imageUrl;
        if (videoUrl) payload.videoUrl = videoUrl;
        const storeId = localStorage.getItem('storeId');
        try {
          const res = await fetch(`${API_BASE}/stores/${storeId}/products`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': localStorage.getItem('token') || ''
            },
            body: JSON.stringify(payload)
          });
          const contentType = res.headers.get('content-type') || '';
          let data = null;
          if (contentType.includes('application/json')) {
            data = await res.json().catch(() => null);
          } else {
            await res.text();
          }
          if (!res.ok) {
            throw new Error((data && (data.error || data.message)) || res.statusText || 'Failed to create product');
          }
          alert((data && data.message) || 'Product created successfully!');
          window.location.href = 'my-products.html';
        } catch (err) {
          alert(err.message || 'Error creating product');
        }
      });
    })();
  </script>
</body>
</html>
