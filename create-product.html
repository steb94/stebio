<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Create Product - Steb.io</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="create-store.html">Create Store</a>
        <a href="create-product.html" class="active">Add Product</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;">
    <h2>Add a New Product</h2>
    <form id="productForm" style="max-width:600px; margin-top:1rem;">
      <div style="margin-bottom:1rem;">
        <label for="productTitle">Title</label><br>
        <input type="text" id="productTitle" placeholder="Product title">
      </div>
      <div style="margin-bottom:1rem;">
        <label for="productDescription">Description</label><br>
        <textarea id="productDescription" rows="4" placeholder="Product description"></textarea>
      </div>
      <div style="margin-bottom:1rem;">
        <label for="productImage">Image URL</label><br>
        <input type="url" id="productImage" placeholder="Image URL (optional)">
      </div>
      <div style="margin-bottom:1rem;">
        <label for="productType">Type</label><br>
        <select id="productType">
          <option value="Trading">Trading</option>
          <option value="Communities">Communities</option>
          <option value="Courses">Courses</option>
          <option value="Software">Software</option>
          <option value="Services">Services</option>
          <option value="Templates">Templates</option>
        </select>
      </div>
      <div style="margin-bottom:1rem;">
        <label for="productPrice">Price ($)</label><br>
        <input type="number" id="productPrice" step="0.01" min="0" placeholder="Price">
      </div>
      <div style="margin-bottom:1rem;">
        <label for="productSupply">Max Supply</label><br>
        <input type="number" id="productSupply" placeholder="Max supply (optional)">
      </div>
      <button type="submit" class="button">Create Product</button>
    </form>
  </main>

  <script src="auth.js"></script>
  <script>
    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const storeId = localStorage.getItem('storeId');
      if (!storeId) {
        alert('Store ID missing. Please create a store first.');
        return;
      }
      const title = document.getElementById('productTitle').value.trim();
      const description = document.getElementById('productDescription').value.trim();
      const image = document.getElementById('productImage').value.trim();
      const type = document.getElementById('productType').value;
      const price = parseFloat(document.getElementById('productPrice').value);
      const supply = document.getElementById('productSupply').value.trim();
      if (!title || isNaN(price)) {
        alert('Please enter at least a title and a price.');
        return;
      }
      const API_BASE = window.location.hostname.includes('onrender.com')
        ? 'https://stebio.onrender.com/api'
        : '/api';
      fetch(`${API_BASE}/products`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          storeId: Number(storeId),
          title,
          description,
          image,
          type,
          price,
          maxSupply: supply ? parseInt(supply) : 0
        })
      })
        .then(res => {
          if (!res.ok) throw new Error('Failed to create product');
          return res.json();
        })
        .then(() => {
          alert('Product created successfully.');
          window.location.href = 'dashboard.html';
        })
        .catch(err => {
          console.error(err);
          alert('Error creating product.');
        });
    });
  </script>
</body>
</html>
