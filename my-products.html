<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Products – Steb.io</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="steb-api-base" content="/api" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">STEB.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="create-store.html">Create Store</a>
        <a href="create-product.html">Add Product</a>
        <a href="dashboard.html">Seller Dashboard</a>
        <!-- mark this link as active for buyers -->
        <a href="my-products.html" class="active">My Products</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;">
    <h2>My Purchased Products</h2>
    <div id="myProductsContainer" class="product-grid"></div>
  </main>

  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('myProductsContainer');
      const apiBase = document.querySelector('meta[name="steb-api-base"]').getAttribute('content') || '/api';
      try {
        // fetch products associated with the logged-in user
        const res = await fetch(\`\${apiBase}/my-products\`);
        if (!res.ok) throw new Error('Failed to load your products');
        const products = await res.json();
        container.innerHTML = '';
        (products || []).forEach(p => {
          const card = document.createElement('div');
          card.className = 'product-card';
          const imgSrc = p.imageUrl || 'https://via.placeholder.com/300x150?text=Product';
          card.innerHTML = \`
            <img src="\${imgSrc}" alt="\${p.title}" />
            <h3>\${p.title}</h3>
            <p>\${p.headline || ''}</p>
            <p>\${p.price ? '$' + p.price.toFixed(2) : 'Free'}</p>
          \`;
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        container.textContent = 'Unable to load your products.';
      }
    });
  </script>
</body>
</html>
