<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email – Steb.io</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container" style="padding:2rem 0;">
    <h2>Email Verification</h2>
    <div id="message">Verifying your account…</div>
  </main>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const token  = params.get('token');
      if (!token) {
        document.getElementById('message').textContent = 'No token provided.';
        return;
      }
      try {
        const res  = await fetch(`/api/users/verify/${token}`);
        const text = await res.text();
        document.getElementById('message').innerHTML = `${text}<br/><a href="login.html">Go to login</a>`;
      } catch {
        document.getElementById('message').textContent = 'Verification failed.';
      }
    })();
  </script>
</body>
</html>
