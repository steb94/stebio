<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Store - Steb.io</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="create-store.html">Start Selling</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;">
    <h2 id="storeTitle">Store</h2>
    <div id="storeProducts" class="product-grid"></div>
  </main>

  <script src="auth.js"></script>
  <script>
    const API_BASE = window.location.hostname.includes('onrender.com')
      ? 'https://stebio.onrender.com/api'
      : '/api';

    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        document.getElementById('storeTitle').textContent = 'Store not found.';
        return;
      }
      fetch(\`\${API_BASE}/stores/\${id}\`)
        .then(res => {
          if (!res.ok) throw new Error('Store not found');
          return res.json();
        })
        .then(store => {
          document.getElementById('storeTitle').textContent = store.name;
          return fetch(\`\${API_BASE}/products?storeId=\${id}\`);
        })
        .then(res => res.json())
        .then(products => {
          const container = document.getElementById('storeProducts');
          container.innerHTML = '';
          (products || []).forEach(p => {
            const card = document.createElement('div');
            card.classList.add('product-card');
            let imgSrc = p.image && p.image.trim() !== '' ? p.image : null;
            if (imgSrc && !/^https?:\/\//.test(imgSrc) && !/^data:/.test(imgSrc)) {
              imgSrc = 'https://raw.githubusercontent.com/steb94/stebio/backend/server-.-js/' + imgSrc;
            }
            card.innerHTML = \`
              <img src="\${imgSrc || 'https://via.placeholder.com/300x150?text=Product'}" alt="\${p.title}">
              <h4>\${p.title}</h4>
              <p>\${p.description.length > 80 ? p.description.slice(0,77) + '...' : p.description}</p>
              <div class="price">$\${p.price.toFixed(2)}</div>
              <div class="type">\${p.type}</div>
              <a href="product.html?id=\${p.id}" class="button">View</a>
            \`;
            container.appendChild(card);
          });
        })
        .catch(() => {
          document.getElementById('storeTitle').textContent = 'Store not found.';
        });
    });
  </script>
</body>
</html>
