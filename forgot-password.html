<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Steb.io</title>
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header id="top-nav">
  <div class="container nav">
    <div class="brand">Steb.io</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="support.html">Support</a>
    </nav>
    <div class="auth-links"></div>
  </div>
</header>

<main class="container" style="padding:2rem 0;">
  <h2>Forgot Password</h2>
  <p>Enter your email below and we’ll send you a link to reset your password.</p>
  <form id="forgotForm" style="max-width:400px;margin-top:1rem;">
    <div class="stack">
      <label for="forgotEmail">Email</label>
      <input id="forgotEmail" type="email" placeholder="Your email" required />
    </div>
    <button type="submit" class="button" style="width:100%;">Send Reset Link</button>
  </form>
  <p id="forgotMessage" style="margin-top:1rem;"></p>
</main>

<script src="auth.js"></script>
<script>
  (function () {
    const API_BASE = '/api';
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();
      try {
        const res = await fetch(\`${API_BASE}/users/forgot\`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        await res.json();
        document.getElementById('forgotMessage').innerText =
          'If this email is registered, a reset link has been sent. Please check your inbox.';
      } catch {
        document.getElementById('forgotMessage').innerText =
          'There was an error sending the email. Please try again later.';
      }
    });
  })();
</script>
</body>
</html>
