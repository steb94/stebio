<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – Steb.io</title>
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="store.html" id="navMyStore">My Store</a>
        <a href="login.html" id="navLogin">Sign in</a>
        <a href="signup.html" id "navSignup">Sign up</a>
      </nav>
    </div>
  </header>
  <main class="container" style="padding:2rem 0; max-width:500px;">
    <h2>Forgot Your Password?</h2>
    <p>Enter your email address below and we'll send you a link to reset your password.</p>
    <form id="forgotForm">
      <div class="stack">
        <label for="forgotEmail">Email</label>
        <input id="forgotEmail" type="email" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="button w-100">Send Reset Link</button>
    </form>
  </main>
  <script src="auth.js"></script>
  <script>
    (function() {
      const API_BASE = document.querySelector('meta[name="steb-api-base"]').getAttribute('content') || '/api';
      document.getElementById('forgotForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('forgotEmail').value.trim();
        try {
          const res = await fetch(`${API_BASE}/users/forgot-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const contentType = res.headers.get('content-type') || '';
          let data = null;
          if (contentType.includes('application/json')) {
            try { data = await res.json(); } catch { data = null; }
          } else {
            await res.text();
          }
          if (!res.ok) {
            throw new Error((data && (data.error || data.message)) || res.statusText || 'Failed to send reset link');
          }
          alert((data && data.message) || 'If an account exists for that email, a reset link has been sent.');
          window.location.href = 'login.html';
        } catch (err) {
          alert(err.message || 'Error sending reset link');
        }
      });
    })();
  </script>
</body>
</html>
