<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Sign In – Steb</title>
  <meta name="steb-api-base" content="/api">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">STEB</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="create-store.html">Start Selling</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;">
    <h2>Sign In</h2>
    <form id="loginForm" class="stack" style="max-width:400px;margin-top:1rem;">
      <div class="stack">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" placeholder="Username">
      </div>
      <div class="stack">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Password">
      </div>
      <button type="submit" class="button">Sign In</button>
    </form>
  </main>

  <script src="auth.js"></script>
  <script>
  (() => {
    const meta = document.querySelector('meta[name="steb-api-base"]');
    const API_BASE = meta && meta.content ? meta.content.replace(/\/+$/, '') : '/api';
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      if (!username || !password) {
        alert('Please enter your username and password.');
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/users/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Failed to sign in');
        }
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.user.username);
        localStorage.setItem('role', data.user.role);
        localStorage.setItem('loggedIn', 'true');
        if (data.user.role === 'seller') {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        alert(err.message || 'Error signing in.');
      }
    });
  })();
  </script>
</body>
</html>
