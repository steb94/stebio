    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="store.html" id="navMyStore">My Store</a>
      <a href="create-store.html" id="navCreateStore">Create Store</a>
      <a href="create-product.html" id="navCreateProduct">Add Product</a>
      <a href="dashboard.html" id="navDashboard">Dashboard</a>
      <a href="my-products.html" id="navMyProducts">My Products</a>
      <a href="login.html" id="navLogin" class="active">Login</a>
      <a href="signup.html" id="navSignup">Sign Up</a>
      <a href="#" id="navLogout">Logout</a>
    </div>
  </nav>

  <div class="container">
    <h2>Log In</h2>
    <form id="loginForm" style="max-width:400px;">
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <input id="loginUsername" type="text" placeholder="Your username" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="Your password" required>
      </div>
      <button type="submit">Log In</button>
      <p style="margin-top:0.5rem;font-size:0.9rem;">Don’t have an account? <a href="signup.html">Sign up here</a></p>
    </form>
  </div>

  <script src="auth.js"></script>
  <script>
    (function() {
      const API_BASE = document.querySelector('meta[name="steb-api-base"]').getAttribute('content') || '/api';
      document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        try {
          const res = await fetch(API_BASE + '/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const contentType = res.headers.get('content-type') || '';
          let data = null;
          if (contentType.includes('application/json')) {
            data = await res.json().catch(() => null);
          } else {
            await res.text();
          }
          if (!res.ok || (data && data.error)) {
            throw new Error((data && (data.error || data.message)) || res.statusText || 'Login failed');
          }
          // Persist auth details
          localStorage.setItem('loggedIn', 'true');
          if (data.username) localStorage.setItem('username', data.username);
          if (data.token)    localStorage.setItem('token', data.token);
          if (data.role)     localStorage.setItem('role', data.role);
          if (data.storeId)  localStorage.setItem('storeId', data.storeId);
          alert('Login successful!');
          window.location.href = 'index.html';
        } catch (err) {
          alert(err.message || 'Login failed');
        }
      });
    })();
  </script>
</body>
</html>
