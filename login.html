<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Steb.io</title>
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <span id="navLinks" style="display:none;">
          <a href="create-store.html">Create Store</a>
          <a href="create-product.html">Add Product</a>
          <a href="dashboard.html">Dashboard</a>
        </span>
        <a href="support.html">Support</a>
        <a href="reviews.html">Reviews</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;">
    <h2>Sign In</h2>
    <form id="loginForm" style="max-width:400px;margin-top:1rem;">
      <div class="stack">
        <label for="loginEmail">Email or Username</label>
        <input id="loginEmail" type="text" placeholder="Your email or username" required />
      </div>
      <div class="stack">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="Your password" required />
      </div>
      <button type="submit" class="button" style="width:100%;">Sign In</button>
      <p style="margin-top:0.5rem;font-size:0.9rem;">
        Don't have an account? <a href="signup.html">Sign up here</a>
      </p>
      <p style="font-size:0.9rem;">
        <a href="forgot-password.html">Forgot your password?</a>
      </p>
    </form>
  </main>

  <script src="auth.js"></script>
  <script>
    (function () {
      const API_BASE = '/api';
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const identifier = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        try {
          const res = await fetch(`${API_BASE}/users/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier, password })
          });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || 'Login failed');
          localStorage.setItem('loggedIn', 'true');
          localStorage.setItem('username', data.username);
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.role);
          if (data.storeId) localStorage.setItem('storeId', data.storeId);
          window.location.href = 'dashboard.html';
        } catch (err) {
          alert(err.message || 'Invalid credentials');
        }
      });
    })();
  </script>
</body>
</html>
