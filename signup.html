<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Steb.io</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Explore Marketplace</a>
        <a href="start-selling.html">Create Store</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="#">Support</a>
      </nav>
      <div class="auth-links">
        <!-- Auth links updated by auth.js -->
        <a href="dashboard.html" id="login-link">Sign In</a> | <a href="signup.html" id="signup-link">Sign Up</a>
      </div>
    </div>
  </header>
  <main class="container" style="padding: 2rem 0; max-width: 600px;">
    <h2>Create your account</h2>
    <p>Please enter a username and choose your role to get started.</p>
    <div class="signup-form">
      <div style="margin-bottom: 1rem;">
        <label for="signupUsername" style="display:block; margin-bottom:0.5rem;">Username</label>
        <input type="text" id="signupUsername" placeholder="Username" style="padding:0.5rem; width:100%;" />
      </div>
      <div style="margin-bottom: 1rem;">
        <label for="signupPassword" style="display:block; margin-bottom:0.5rem;">Password</label>
        <input type="password" id="signupPassword" placeholder="Password" style="padding:0.5rem; width:100%;" />
      </div>
      <div style="margin-bottom: 1rem;">
        <label for="signupRole" style="display:block; margin-bottom:0.5rem;">I want to</label>
        <select id="signupRole" style="padding:0.5rem; width:100%;">
          <option value="buyer">Buy products</option>
          <option value="seller">Sell products (create a store)</option>
        </select>
      </div>
      <button id="signupBtn" style="padding: 0.75rem 1.5rem; background:#667eea; color:#fff; border:none; border-radius:4px; font-weight:600;">Sign Up</button>
    </div>
  </main>
  <script>
    // Handle sign up button click
    document.getElementById('signupBtn').addEventListener('click', function() {
      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('signupPassword').value;
      const role = document.getElementById('signupRole').value;
      if (!username || !password) {
        alert('Please enter a username and password.');
        return;
      }
      localStorage.setItem('loggedIn', 'true');
      localStorage.setItem('username', username);
      localStorage.setItem('password', password);
      localStorage.setItem('role', role);
      if (role === 'seller') {
        window.location.href = 'create-store.html';
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
  <script src="auth.js"></script>
</body>
</html>
