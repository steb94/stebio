<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Steb.io</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">Steb.io</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </nav>
  </header>
  <main class="container">
    <h2>Sign Up</h2>
    <form id="signupForm" class="form">
      <label for="su_username">Username</label>
      <input type="text" id="su_username" required />
      <label for="su_password">Password</label>
      <input type="password" id="su_password" required />
      <label for="su_role">Role</label>
      <select id="su_role">
        <option value="buyer">Buyer</option>
        <option value="seller">Seller</option>
      </select>
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
    <div id="signupError" class="error-message"></div>
  </main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('su_username').value.trim();
      const password = document.getElementById('su_password').value.trim();
      const role     = document.getElementById('su_role').value;
      const result   = await signup(username, password, role);
      if (result.error) {
        document.getElementById('signupError').textContent = result.error;
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
