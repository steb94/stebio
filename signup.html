<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Steb.io</title>
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <span id="navLinks" style="display:none;">
          <a href="create-store.html">Create Store</a>
          <a href="create-product.html">Add Product</a>
          <a href="dashboard.html">Dashboard</a>
        </span>
        <a href="support.html">Support</a>
        <a href="reviews.html">Reviews</a>
      </nav>
      <div class="auth-links">
        <a href="login.html">Sign in</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;">
    <h2>Create an Account</h2>
    <form id="signupForm" style="max-width:400px;margin-top:1rem;">
      <div class="stack">
        <label for="signupEmail">Email</label>
        <input id="signupEmail" type="email" placeholder="Your email" required />
      </div>
      <div class="stack">
        <label for="signupUsername">Username</label>
        <input id="signupUsername" type="text" placeholder="Choose a username" required />
      </div>
      <div class="stack">
        <label for="signupPassword">Password</label>
        <input id="signupPassword" type="password" placeholder="Create a password" required />
      </div>
      <div class="stack">
        <label for="signupConfirm">Confirm Password</label>
        <input id="signupConfirm" type="password" placeholder="Confirm your password" required />
      </div>
      <button type="submit" class="button" style="width:100%;">Sign Up</button>
      <p style="margin-top:0.5rem;font-size:0.9rem;">
        Already have an account? <a href="login.html">Sign in here</a>
      </p>
    </form>
  </main>

  <script src="auth.js"></script>
  <script>
    (function () {
      const API_BASE = '/api';
      if (localStorage.getItem('loggedIn') === 'true') {
        document.getElementById('navLinks').style.display = '';
      }
      document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('signupEmail').value.trim();
        const username = document.getElementById('signupUsername').value.trim();
        const password = document.getElementById('signupPassword').value;
        const confirm = document.getElementById('signupConfirm').value;
        if (password !== confirm) {
          alert('Passwords do not match');
          return;
        }
        try {
          const res = await fetch(`${API_BASE}/users/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, username, password })
          });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || 'Registration failed');
          alert('Registration successful! Please check your email for a verification link.');
          window.location.href = 'login.html';
        } catch (err) {
          alert(err.message || 'Error registering account');
        }
      });
    })();
  </script>
</body>
</html>
