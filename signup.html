<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Steb.io</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Explore Marketplace</a>
        <a href="start-selling.html">Create Store</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="#">Support</a>
      </nav>
      <div class="auth-links">
        <a href="#" id="login-link">Sign In</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;">
    <h2>Create an Account</h2>
    <form id="signupForm" class="signup-form" onsubmit="return false;">
      <div style="margin-bottom:1rem;">
        <label for="signupUsername">Username</label><br />
        <input type="text" id="signupUsername" placeholder="Enter username" style="padding:0.5rem; width:300px;" />
      </div>
      <div style="margin-bottom:1rem;">
        <label for="signupPassword">Password</label><br />
        <input type="password" id="signupPassword" placeholder="Enter password" style="padding:0.5rem; width:300px;" />
      </div>
      <div style="margin-bottom:1rem;">
        <label for="roleSelect">Role</label><br />
        <select id="roleSelect" style="padding:0.5rem; width:300px;">
          <option value="buyer">Buy products</option>
          <option value="seller">Sell products (create a store)</option>
        </select>
      </div>
      <button id="signupBtn" style="padding:0.5rem 1rem;">Sign Up</button>
    </form>
  </main>

  <script>
    document.getElementById('signupBtn').addEventListener('click', () => {
      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('signupPassword').value.trim();
      const role = document.getElementById('roleSelect').value;
      if (username === '' || password === '') {
        alert('Please enter both username and password.');
        return;
      }
      localStorage.setItem('username', username);
      localStorage.setItem('password', password);
      localStorage.setItem('role', role);
      localStorage.setItem('loggedIn', 'true');
      if (role === 'seller') {
        // redirect sellers to create-store page
        window.location.href = 'create-store.html';
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
  <script src="auth.js"></script>
</body>
</html>
