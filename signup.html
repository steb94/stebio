<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Steb.io</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Explore Marketplace</a>
        <a href="create-store.html">Create Store</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>
  <main class="container" style="padding: 2rem 0;">
    <h2>Create an Account</h2>
    <form id="signupForm" style="max-width:400px">
      <div style="margin-bottom:1rem;">
        <label for="signupUsername">Username</label><br>
        <input type="text" id="signupUsername" placeholder="Enter username" style="width:100%; padding:0.5rem;">
      </div>
      <div style="margin-bottom:1rem;">
        <label for="signupPassword">Password</label><br>
        <input type="password" id="signupPassword" placeholder="Enter password" style="width:100%; padding:0.5rem;">
      </div>
      <div style="margin-bottom:1rem;">
        <label for="roleSelect">Role</label><br>
        <select id="roleSelect" style="width:100%; padding:0.5rem;">
          <option value="buyer">Buy products</option>
          <option value="seller">Sell products (create a store)</option>
        </select>
      </div>
      <button type="submit" style="padding:0.5rem 1rem;">Sign Up</button>
    </form>
  </main>
  <script src="auth.js"></script>
  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('signupPassword').value.trim();
      const role = document.getElementById('roleSelect').value;
      if (!username || !password) {
        alert('Please enter a username and password.');
        return;
      }
      localStorage.setItem('username', username);
      localStorage.setItem('password', password);
      localStorage.setItem('role', role);
      localStorage.setItem('loggedIn', 'true');
      if (role === 'seller') {
        window.location.href = 'create-store.html';
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
