<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Sign Up – Steb.io</title>
  <meta name="steb-api-base" content="/api">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="create-store.html">Start Selling</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;">
    <h2>Create an Account</h2>
    <form id="signupForm" style="max-width:400px;margin-top:1rem;">
      <div style="margin-bottom:1rem;">
        <label for="signupUsername">Username</label><br>
        <input type="text" id="signupUsername" placeholder="Enter username">
      </div>
      <div style="margin-bottom:1rem;">
        <label for="signupPassword">Password</label><br>
        <input type="password" id="signupPassword" placeholder="Enter password">
      </div>
      <div style="margin-bottom:1rem;">
        <label for="roleSelect">Role</label><br>
        <select id="roleSelect">
          <option value="buyer">Buy products</option>
          <option value="seller">Sell products (create a store)</option>
        </select>
      </div>
      <button type="submit" class="button">Sign Up</button>
    </form>
  </main>

  <script src="auth.js"></script>
  <script>
  (() => {
    const meta = document.querySelector('meta[name="steb-api-base"]');
    const API_BASE = meta && meta.content ? meta.content.replace(/\/+$/, '') : '/api';
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('signupPassword').value.trim();
      const role = document.getElementById('roleSelect').value;
      if (!username || !password) {
        alert('Please enter a username and password.');
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/users/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Failed to sign up');
        }
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.user.username);
        localStorage.setItem('role', data.user.role);
        localStorage.setItem('userId', data.user.id);
        localStorage.setItem('loggedIn', 'true');
        if (data.user.role === 'seller') {
          window.location.href = 'create-store.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        alert(err.message || 'Error signing up.');
      }
    });
  })();
  </script>
</body>
</html>
