<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Steb.io</title>
  <!-- API base for calls to the back‑end -->
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="create-store.html">Create Store</a>
        <a href="create-product.html">Add Product</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;">
    <h2>Create an Account</h2>
    <form id="signupForm" style="max-width:400px;margin-top:1rem;">
      <div class="stack">
        <label for="signupUsername">Username</label>
        <input id="signupUsername" type="text" placeholder="Choose a username" required />
      </div>
      <div class="stack">
        <label for="signupPassword">Password</label>
        <input id="signupPassword" type="password" placeholder="Create a password" required />
      </div>
      <div class="stack">
        <label for="signupConfirm">Confirm Password</label>
        <input id="signupConfirm" type="password" placeholder="Confirm your password" required />
      </div>
      <button type="submit" class="button" style="width:100%;">Sign Up</button>
      <p style="margin-top:0.5rem;font-size:0.9rem;">
        Already have an account? <a href="login.html">Sign in here</a>
      </p>
    </form>
  </main>

  <script src="auth.js"></script>
  <script>
    (function () {
      const meta = document.querySelector('meta[name="steb-api-base"]');
      const API_BASE = meta && meta.content ? meta.content.replace(/\\/+$/, '') : '/api';
      document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('signupUsername').value.trim();
        const password = document.getElementById('signupPassword').value;
        const confirm = document.getElementById('signupConfirm').value;
        if (!username || !password) return;
        if (password !== confirm) {
          alert('Passwords do not match');
          return;
        }
        try {
          const res = await fetch(\`\${API_BASE}/register\`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || 'Registration failed');
          // Save login state
          localStorage.setItem('loggedIn', 'true');
          localStorage.setItem('username', username);
          localStorage.setItem('password', password);
          if (data.token) localStorage.setItem('token', data.token);
          if (data.role) localStorage.setItem('role', data.role);
          if (data.storeId) localStorage.setItem('storeId', data.storeId);
          // Redirect new sellers to store creation
          window.location.href = 'create-store.html';
        } catch (err) {
          alert(err.message || 'Error registering account');
        }
      });
    })();
  </script>
</body>
</html>
