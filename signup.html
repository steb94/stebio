<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Steb.io</title>
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="create-store.html">Create Store</a>
        <a href="create-product.html">Add Product</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;">
    <h2>Create an Account</h2>
    <form id="signupForm" style="max-width:400px;margin-top:1rem;">
      <div class="stack">
        <label for="signupUsername">Username</label>
        <input id="signupUsername" type="text" placeholder="Choose a username" required />
      </div>
      <div class="stack">
        <label for="signupEmail">Email</label>
        <input id="signupEmail" type="email" placeholder="Your email address" required />
      </div>
      <div class="stack">
        <label for="signupPassword">Password</label>
        <input id="signupPassword" type="password" placeholder="Create a password" required />
      </div>
      <div class="stack">
        <label for="signupConfirm">Confirm Password</label>
        <input id="signupConfirm" type="password" placeholder="Confirm your password" required />
      </div>
      <button type="submit" class="button" style="width:100%;">Sign Up</button>
      <p style="margin-top:0.5rem;font-size:0.9rem;">
        Already have an account? <a href="login.html">Sign in here</a>
      </p>
    </form>
    <p id="signupMessage" style="margin-top:1rem;color:var(--accent);"></p>
  </main>

  <script src="auth.js"></script>
  <script>
    (function () {
      const meta = document.querySelector('meta[name="steb-api-base"]');
      const API_BASE = meta && meta.content ? meta.content.replace(/\\/+/g, '') : '/api';
      document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('signupUsername').value.trim();
        const email    = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        const confirm  = document.getElementById('signupConfirm').value;
        const msgEl    = document.getElementById('signupMessage');
        msgEl.textContent = '';
        if (!username || !email || !password) return;
        if (password !== confirm) {
          msgEl.textContent = 'Passwords do not match.';
          return;
        }
        try {
          const res = await fetch(\`\${API_BASE}/users/register\`, {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ username, email, password })
          });
          const data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || 'Registration failed');
          // If the API sends back a message to check email, show it
          if (data.message) {
            msgEl.textContent = data.message;
            msgEl.style.color = 'green';
          }
          // Store token (optional) and redirect if desired
          if (data.token) {
            localStorage.setItem('loggedIn', 'true');
            localStorage.setItem('username', username);
            localStorage.setItem('token', data.token);
            if (data.role) localStorage.setItem('role', data.role);
            if (data.storeId) localStorage.setItem('storeId', data.storeId);
            // redirect new sellers to create-store.html
            window.location.href = 'create-store.html';
          }
        } catch (err) {
          msgEl.textContent = err.message || 'Error registering account';
        }
      });
    })();
  </script>
</body>
</html>
