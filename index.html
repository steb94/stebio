<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Steb.io Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html" class="active">Home</a>
        <a href="create-store.html">Start Selling</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="support.html">Support</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Turn your passion into profit</h1>
      <p>Discover and support digital creators, or start your own business in minutes.</p>
      <div class="cta-buttons">
        <a href="create-store.html" class="button">Start Selling</a>
        <a href="#productSection" class="button">Explore Marketplace</a>
      </div>
      <div class="search-bar">
        <input id="searchInput" type="text" placeholder="Search products, communities, courses…">
        <button id="searchBtn">Search</button>
      </div>
    </div>
  </section>

  <section id="categories">
    <div class="container">
      <div class="category-bar" id="categoryBar">
        <button data-type="All" class="active">All</button>
        <button data-type="Trading">Trading</button>
        <button data-type="Communities">Communities</button>
        <button data-type="Courses">Courses</button>
        <button data-type="Software">Software</button>
        <button data-type="Services">Services</button>
        <button data-type="Templates">Templates</button>
      </div>
    </div>
  </section>

  <section id="stats">
    <div class="container stats-grid">
      <div class="stat-card">
        <h3 id="statProducts">0</h3>
        <p>Products</p>
      </div>
      <div class="stat-card">
        <h3 id="statStores">0</h3>
        <p>Stores</p>
      </div>
      <div class="stat-card">
        <h3 id="statOrders">0</h3>
        <p>Orders</p>
      </div>
    </div>
  </section>

  <!-- Featured stores -->
  <section id="storeSection">
    <div class="container">
      <h3>Featured Stores</h3>
      <div id="storeGrid" class="product-grid"></div>
    </div>
  </section>

  <section id="controls">
    <div class="container control-bar">
      <label for="sortSelect">Sort by:</label>
      <select id="sortSelect">
        <option value="newest">Newest</option>
        <option value="price_asc">Price: Low → High</option>
        <option value="price_desc">Price: High → Low</option>
      </select>
    </div>
  </section>

  <section id="productSection">
    <div class="container">
      <div id="productGrid" class="product-grid">
        <!-- Products loaded via JS -->
      </div>
      <div id="loadMoreContainer" hidden>
        <button id="loadMoreBtn" class="button">Load more</button>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
