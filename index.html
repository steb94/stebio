<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steb.io – Marketplace</title>
  <!-- Set the API base to your back‑end's base URL if deployed separately -->
  <meta name="steb-api-base" content="/api" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="top-nav">
    <div class="container nav">
      <div class="brand">Steb.io</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="store.html" id="navMyStore" style="display:none;">My Store</a>
        <a href="create-store.html" id="navCreateStore" style="display:none;">Create Store</a>
        <a href="create-product.html" id="navCreateProduct" style="display:none;">Add Product</a>
        <a href="dashboard.html" id="navDashboard" style="display:none;">Dashboard</a>
        <a href="my-products.html" id="navMyProducts" style="display:none;">My Products</a>
        <a href="reviews.html">Reviews</a>
        <a href="support.html">Support</a>
        <a href="#" id="navLogout" style="display:none;">Logout</a>
        <a href="login.html" id="navLogin">Sign in</a>
        <a href="signup.html" id="navSignup">Sign up</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:2rem 0;">
    <!-- Hero section -->
    <section class="hero">
      <h1>Discover Your Next Digital Product</h1>
      <p>A powerful marketplace to buy and sell courses, communities, chat rooms, software, services, and more.</p>
    </section>

    <!-- Stats section -->
    <section class="stats row g-3" id="statsSection">
      <!-- Cards for total products, stores, orders will be injected here -->
    </section>

    <!-- Search & filter -->
    <section class="search-filter" style="margin:2rem 0;">
      <form id="searchForm" class="row g-2 align-items-end">
        <div class="col-md-4">
          <label for="searchText" class="form-label">Search Products</label>
          <input id="searchText" type="text" class="form-control" placeholder="Type keywords..." />
        </div>
        <div class="col-md-3">
          <label for="searchType" class="form-label">Category</label>
          <select id="searchType" class="form-control">
            <option value="">All Categories</option>
            <option value="Trading">Trading</option>
            <option value="Communities">Communities</option>
            <option value="Courses">Courses</option>
            <option value="Software">Software</option>
            <option value="Services">Services</option>
            <option value="Templates">Templates</option>
            <option value="ChatRoom">Chat Room</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="searchSort" class="form-label">Sort by</label>
          <select id="searchSort" class="form-control">
            <option value="">Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A–Z</option>
            <option value="name-desc">Name: Z–A</option>
          </select>
        </div>
        <div class="col-md-2">
          <button type="submit" class="button w-100">Search</button>
        </div>
      </form>
    </section>

    <!-- Product grid -->
    <section class="product-grid" id="productGrid"
             style="display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:1rem;">
      <!-- Product cards will be inserted here -->
    </section>
  </main>

  <script src="auth.js"></script>
  <script>
    (function() {
      const API_BASE = document.querySelector('meta[name=\"steb-api-base\"]').getAttribute('content') || '/api';
      let allProducts = [];

      // Load stats
      function loadStats() {
        fetch(`${API_BASE}/stats`)
          .then(res => res.json())
          .then(data => {
            const statsSection = document.getElementById('statsSection');
            statsSection.innerHTML = '';
            const makeCard = (title, value) => {
              const col = document.createElement('div');
              col.className = 'col-md-4';
              col.innerHTML = `
                <div class=\"card\">
                  <h3>${value}</h3>
                  <p>${title}</p>
                </div>`;
              statsSection.appendChild(col);
            };
            makeCard('Products', data.totalProducts || 0);
            makeCard('Stores', data.totalStores || 0);
            makeCard('Orders', data.totalOrders || 0);
          });
      }

      // Load all products
      function loadProducts() {
        fetch(`${API_BASE}/products`)
          .then(res => res.json())
          .then(data => {
            allProducts = Array.isArray(data) ? data : (data.products || []);
            renderProducts(allProducts);
          });
      }

      // Render product cards
      function getPrice(prod) {
        // Determine a numeric price for sorting (uses first pricing tier if present)
        if (Array.isArray(prod.pricing) && prod.pricing.length > 0) {
          const p = parseFloat(prod.pricing[0].price);
          return isNaN(p) ? 0 : p;
        }
        const base = parseFloat(prod.price);
        return isNaN(base) ? 0 : base;
      }

      function renderProducts(products) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        products.forEach(prod => {
          const card = document.createElement('div');
          card.className = 'card';
          const imgSrc = prod.imageUrl && prod.imageUrl.trim()
            ? (prod.imageUrl.match(/^https?:\\/\\//) ? prod.imageUrl
               : `https://raw.githubusercontent.com/steb94/stebio/backend/server-.-js/${prod.imageUrl}`)
            : 'https://via.placeholder.com/400x200?text=Product';
          const price = Array.isArray(prod.pricing) && prod.pricing.length > 0
            ? Number(prod.pricing[0].price).toFixed(2)
            : Number(prod.price || 0).toFixed(2);
          card.innerHTML = `
            <img src=\"${imgSrc}\"
                 alt=\"${prod.title}\"
                 style=\"width:100%; height:140px; object-fit:cover; border-radius:8px 8px 0 0;\">
            <div style=\"padding:0.5rem;\">
              <h4 style=\"margin-bottom:0.5rem;\">${prod.title}</h4>
              <p style=\"margin:0.2rem 0;\"><strong>Type:</strong> ${prod.type}</p>
              <p style=\"margin:0.2rem 0;\"><strong>Price:</strong> $${price}</p>
              <a href=\"product.html?id=${encodeURIComponent(prod.id)}\" class=\"button w-100\" style=\"margin-top:0.5rem;\">View Product</a>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      // Filter products
      document.getElementById('searchForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const text = document.getElementById('searchText').value.toLowerCase();
        const type = document.getElementById('searchType').value;
        const sort = document.getElementById('searchSort').value;
        let filtered = allProducts.filter(p => {
          const matchText =
            p.title.toLowerCase().includes(text) ||
            (p.description || '').toLowerCase().includes(text);
          const matchType = !type || p.type === type;
          return matchText && matchType;
        });
        // Apply sorting
        if (sort) {
          filtered = filtered.slice(); // copy array before sorting
          filtered.sort((a, b) => {
            if (sort === 'price-asc') {
              return getPrice(a) - getPrice(b);
            } else if (sort === 'price-desc') {
              return getPrice(b) - getPrice(a);
            } else if (sort === 'name-asc') {
              return a.title.localeCompare(b.title);
            } else if (sort === 'name-desc') {
              return b.title.localeCompare(a.title);
            }
            return 0;
          });
        }
        renderProducts(filtered);
      });

      // Initial load
      document.addEventListener('DOMContentLoaded', () => {
        loadStats();
        loadProducts();
      });
    })();
  </script>
</body>
</html>
