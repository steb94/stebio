=<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steb.io Marketplace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">Steb.io</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html" id="dashboardLink">Dashboard</a>
      <a href="login.html" id="loginLink">Login</a>
      <a href="signup.html" id="signupLink">Sign Up</a>
      <a href="#" id="logoutLink" style="display:none;">Logout</a>
    </nav>
  </header>
  <main class="container">
    <!-- Search and filter bar -->
    <section class="search-section">
      <input type="text" id="searchInput" placeholder="Search products...">
      <select id="categorySelect"></select>
      <select id="sortSelect">
        <option value="">Sort by</option>
        <option value="rating">Rating</option>
        <option value="price">Price</option>
        <option value="name">Name</option>
      </select>
      <select id="orderSelect">
        <option value="desc">Descending</option>
        <option value="asc">Ascending</option>
      </select>
      <button id="searchBtn">Search</button>
    </section>
    <!-- Site statistics -->
    <section id="stats" class="stats"></section>
    <!-- Trending section -->
    <section id="trending">
      <h3>Trending Categories</h3>
      <div id="trendingCategories" class="categories-list"></div>
      <h3>Trending Products</h3>
      <div id="trendingProducts" class="trending-products"></div>
    </section>
    <!-- Products section -->
    <section id="products">
      <h3>Products</h3>
      <div id="productsGrid" class="product-grid"></div>
    </section>
  </main>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // update nav based on login state
      updateNav();
      // load global stats
      loadStats();
      // load category stats and trending categories
      loadCategories();
      // load trending products (all time)
      loadTrending();
      // load initial product list without filters
      loadProducts({});
      // Search button click handler
      document.getElementById('searchBtn').addEventListener('click', () => {
        const query    = document.getElementById('searchInput').value.trim();
        const category = document.getElementById('categorySelect').value;
        const sort     = document.getElementById('sortSelect').value;
        const order    = document.getElementById('orderSelect').value;
        loadProducts({ query, category, sort, order });
      });
    });
    // Logout handler
    document.getElementById('logoutLink').addEventListener('click', () => {
      logout();
      updateNav();
      // reload products after logout to refresh nav links
      loadProducts({});
    });
  </script>
</body>
</html>
